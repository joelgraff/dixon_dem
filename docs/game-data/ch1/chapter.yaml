id: ch1
title: "Chapter 1: Ogee's Ferry"
start: museum
max_score: 127

# Every room file, in the order the browser loads them (it can't list folders).
rooms: [museum, street, riverwalk, wateredge, landing, cabin, camp, northlanding, slough]

# Flags that score. Points are given the first time the flag is set and taken
# back if a rewind clears it. Other flags need no declaration, but listing the
# important ones here documents them.
flags:
  present.panel_read:      {score: 2, desc: Read the founding panel}
  present.crossword_read:  {score: 2, desc: Read Margaret's crossword}
  present.signed:          {score: 2, desc: Signed the guestbook}
  present.sticker_peeled:  {score: 2, desc: Peeled back the bumper sticker}
  present.marker_read:     {score: 2, desc: Read the marker's sanded line}
  present.planks:          {score: 3, desc: Watched the water until the planks appeared}
  present.voice:           {desc: The 1830 bank and the voice are showing}
  present.returned:        {desc: Has come back from 1830 at least once}
  1830.arrived:            {score: 5, desc: Answered the voice}
  1830.met_ogee:           {score: 3, desc: Heard from Ogee why he can't cross}
  1830.has_rope:           {score: 3, desc: Got the rope from Dixon}
  1830.madeline_told:      {desc: Told Madeline what you're borrowing her things for}
  1830.has_axe:            {score: 1, desc: Took the axe}
  1830.has_paddle:         {score: 4, desc: Borrowed Madeline's father's paddle}
  1830.paddle_returned:    {score: 2, desc: Gave the paddle back to Madeline}
  1830.axe_returned:       {score: 2, desc: Gave the axe back to Madeline}
  1830.key_lost:           {desc: Heard from James that the mail key is gone}
  1830.crow_traded:        {score: 4, desc: Traded Asa's dollar to the crow for the key}
  1830.has_key:            {desc: Holding James's mail key}
  1830.key_returned:       {score: 6, desc: Gave the mail key back to James}
  1830.pole_returned:      {score: 2, desc: Gave the setting pole back to Ogee}
  1830.canoe_tarred:       {score: 5, desc: Tarred the canoe}
  1830.canoe_across:       {desc: The canoe is at the north landing}
  1830.rope_strung:        {score: 7, desc: Tied the rope on the north bank}
  1830.met_eli:            {score: 2, desc: Talked to Eli about his uncle}
  1830.has_pole:           {score: 3, desc: Borrowed Ogee's setting pole}
  1830.has_brush:          {score: 4, desc: Cut willow branches}
  1830.brush_placed:       {desc: Willow branches are under the wheels}
  1830.wagon_free:         {score: 10, desc: Freed Asa's wagon}
  1830.shoe_lost:          {desc: The pole shoe is in the mud}
  1830.dixon_short:        {score: 4, desc: Learned Dixon has no silver for the overdue hundred}
  1830.asa_needs_ferry:    {score: 5, desc: Heard why Asa needs the ferry running}
  1830.lease_dixon:        {score: 19, desc: Brought Asa and Dixon together; the lease is in Dixon's name}
  1830.lease_player:       {desc: Wrong fix - had Asa pay the agent, with your name on the paper}
  1830.shoe_returned:      {score: 8, desc: Returned the pole shoe to Ogee}
  1830.fog:                {desc: The chapter-end fog has come in}
  chapter1.done:           {score: 4, desc: Talked to Margaret after the repair}
  chapter1.ended:          {desc: Left the museum with Margaret; the chapter is over}
  present.noticed_panel:   {score: 1, desc: Noticed the change to the panel}
  present.noticed_shoe:    {score: 1, desc: Noticed the pole shoe on the pedestal}
  present.noticed_token:   {score: 1, desc: Noticed the change to the token}
  present.noticed_engraving: {score: 1, desc: Noticed the engraving in the empty frame}
  present.noticed_clock:   {score: 1, desc: Noticed the change to the clock}
  present.noticed_crossword: {score: 1, desc: Noticed the change to the crossword}
  present.noticed_sign:    {score: 1, desc: Noticed the change to the sign}
  present.noticed_sticker: {score: 1, desc: Noticed the change to the sticker}
  present.noticed_marker:  {score: 1, desc: Noticed the change to the marker}
  present.noticed_plaque:  {score: 1, desc: Noticed the change to the plaque}
  present.noticed_desk:    {score: 1, desc: Noticed the desk's plate}
  present.noticed_key:     {desc: Saw the old key on the blotter}

# Score check: 13 present + 99 in 1830 + 4 at the end = 116, plus 11 for noticing
# what changed in the present after the repair = 127.

vars:
  town:
    - {when: [1830.lease_dixon], text: Dixon}
    - {when: [1830.lease_player], text: Landing}
    - {text: Rolette}
  town_in:                 # "It was in {town_in} that I really found myself"
    - {when: [1830.lease_dixon], text: Dixon}
    - {when: [1830.lease_player], text: the Landing}
    - {text: Rolette}

start_items: [phone]
start_money: 0

# The silver in your pocket (money), lookable whenever you have any.
money_item:
  name: silver dollar
  aliases: [dollar, coin, money, silver, asa's dollar, asa's silver dollar]
  look: "{asa's} silver dollar is heavy for its size and worn smooth at the rim, and it's bright where somebody's thumb has rubbed it. It catches the light whichever way you turn it."
  verbs:
    taste: "It tastes of metal and of {asa's} pocket."
    take: It's already in your pocket.

items:
  phone:
    name: phone
    aliases: [cell, cellphone, mobile, tin, tin case, case, flashlight, camera, light]
    verbs:
      show:
        - when: [era:1830]
          text: There's nobody here to show it to, which is probably for the best.
        - text: Nobody here needs to see your phone.
      light:
        - when: [era:1830]
          text: The light comes on, startlingly white against the grey, and you shut it off again fast. Nobody saw, as far as you can tell.
        - text: The flashlight comes on, but nothing here needs lighting, so you turn it off again.
      photograph: You take a picture, and maybe later you'll find out whether it came out.
      call:
        - when: [era:1830]
          text: There are no bars, and in 1830 there is nobody to call anyway.
        - text: You can't think of anyone you need to call right now.
    look:
      - when: [era:1830]
        text: It looks like a flat tin case, the kind a man keeps tobacco in, but when you open it, it's your phone, which came through the river better than you did. There are no bars and the clock is stuck at 4:17, but the battery reads 61 percent and the assistant still opens, so you could ask it for help. To anyone watching, you suspect, it would look like a great deal more than a tin.
      - when: [in:wateredge, turns>=2, not 1830.lease_dixon]
        text: The screen has gone dim and the bars are gone. The clock reads 4:17, and it doesn't change while you watch it.
      - when: [1830.lease_dixon]
        text: The battery is at 58 percent with a full signal. The clock reads 4:21, and while you watch, it turns over to 4:22.
      - text: The battery is at 61 percent with a full signal, and there's nothing new.
  rope:
    era: 1830
    name: coil of rope
    aliases: [rope, coil, hemp, line]
    look: "The coil of new hemp is heavy: every foot that {dixon} could buy in Peoria."
  axe:
    era: 1830
    name: axe
    aliases: [hatchet]
    look: "This is {ogee's} axe, with an edge still sharp enough to catch a thumbnail."
  paddle:
    era: 1830
    name: paddle
    aliases: [oar]
    look: "It's {madeline's} father's paddle, one piece of ash, the grip worn dark and smooth by somebody's hands for a long time before yours."
  silver:
    era: 1830
    name: "Asa's silver"
    aliases: [silver, bag, canvas bag, hundred, dollars, coins, asa's silver, bag of silver]
    look: "A canvas bag of a hundred silver dollars, knotted at the neck and heavier than it looks. It's {asa's} money, and it's meant for {dixon}."
  key:
    era: 1830
    name: brass key
    aliases: [key, brass key, mail key, little key, string]
    look: A small brass key, worn smooth, hangs from a loop of greasy string. It looks like the kind of key that fits one lock and no other.
  pole:
    era: 1830
    name: setting pole
    aliases: [pole, setting pole, ash pole]
    look:
      - when: [1830.shoe_lost, not 1830.shoe_returned]
        text: "{ogee's} ash setting pole feels lighter at the foot now that its iron shoe is gone."
      - text: "{ogee's} ash setting pole is long and heavy, shod at the foot with a cone of forged iron."
  brush:
    era: 1830
    name: bundle of willow branches
    aliases: [brush, willow, willows, bundle, branches, willow branches]
    look: It's an armful of willow branches, cut and bundled together.
  shoe:
    era: 1830
    name: pole shoe
    aliases: [shoe, iron shoe, pole shoe, iron]
    look: It's a cone of forged iron, dented on one side and caked with mud.
# The end of the chapter: once `when` holds, every command but the meta ones
# (help, save, restore, restart, version, tour, score) gets `blocked`.
ending:
  when: [chapter1.ended]
  title: "The end of Chapter 1"
  blocked: "Margaret has locked up and gone home, and chapter 1 is over. Type restart to play again, or restore to load a saved game."

# The chapter-end fog: while it holds, every exit in an 1830 room is blocked
# and the room_line is added to every 1830 room description.
fog_lock:
  when: [1830.fog]
  room_line: The fog has closed in around you, thick and white, and a rough hand has found your sleeve.
  blocked: The fog is too thick to go anywhere. You take one step and lose all sense of direction, and {ogee's} hand tightens on your sleeve. "Not that way. Take my arm."

deaths:
  pole_high_water: >-
    You push the ferry off, and the current takes it and you with it, and the
    landing is a long way behind before you think of letting go. {ogee} did
    mention that the river was up, several times.
  canoe_sinks: >-
    Halfway across, the split seam opens like a mouth, and the Rock River
    accepts the canoe and then you with equal enthusiasm.
  no_paddle: >-
    The current takes the canoe gently and completely, and somewhere past
    what will one day be Sterling, you reflect that a paddle would have
    helped.
  swim: >-
    The river in April is colder than it looks, and it looks very cold.
  railing: >-
    You swing a leg over the railing for a better look, and the riprap turns
    out to be exactly as hard as it looked from up there.

# Actions that work in several rooms.
# The deal, in two steps the player plays: Asa buys a season of crossings
# in advance and hands you the silver to carry (here, shared by Asa's topic
# and the asa_deal action); you give it to Dixon at the camp, and he walks
# down with you and pays the agent (camp.yaml, deliver_silver). Paying the
# agent yourself puts your name on the lease (landing.yaml, pay_agent).
deal_text: &deal >-
  {asa} hears you out with his arms folded, looking from the man on the crate to his wagons to the river. "Season of crossings," he says at last. "A hundred in silver now, and my wagons cross free till it's worked off." He counts the coins into a canvas bag, knots it and puts it in your hands. "Take that up to Dixon. I'm not leaving my wagons with that fella sitting there."
deal_do: &deal_do
  - give: silver
  - set: [1830.asa_needs_ferry, known.dixon]

actions:
  - id: asa_deal
    speaker: asa
    phrases: [tell asa about dixon, ask asa to help dixon, introduce asa to dixon, ask asa to pay, ask asa for money, ask asa for silver, ask asa for 100, ask asa to pay dixon, tell asa dixon needs silver, tell asa dixon needs money, ask asa to lend dixon money, ask asa to lend dixon silver, tell asa to talk to dixon, ask asa to talk to dixon, ask asa to buy crossings, ask asa about a deal, make a deal, tell asa about the lease, tell asa about lease, ask asa to pay for crossings, ask asa to pay in advance, fetch dixon, get dixon, bring dixon, send for dixon, ask asa to help]
    when: [here:asa, 1830.wagon_free, not 1830.lease_dixon, not 1830.lease_player, not has:silver]
    do:
      - if:
          when: [1830.dixon_short]
          do:
            - say: *deal
            - give: silver
            - set: [1830.asa_needs_ferry, known.dixon]
          else:
            - say: "\"Dixon? The mail fella, up at the camp?\" He folds his arms. \"Before I go into my coat, I want to hear from him what he's short of.\""
    else:
      - when: [not here:asa]
        say: There's nobody here who can help with that.
      - when: [has:silver]
        say: "\"You've got it,\" {asa} says, with a nod at the bag. \"Dixon's up at the camp.\""
      - when: [1830.lease_dixon]
        say: It's done, and the lease is in {dixon's} name.
      - say: "{asa} has a wagon in the mud, and that's all the business he means to do today."

  - id: asa_pays_agent
    speaker: asa
    phrases: [ask asa to pay agent, tell asa to pay agent, ask asa to pay the agent, tell asa to pay the agent, ask asa to pay the debt, ask asa to pay debt, ask asa to pay rolette's man, tell asa to pay rolette's man, ask asa to pay off agent, ask asa to pay off the debt]
    when: [here:asa, here:agent, 1830.wagon_free, not 1830.lease_dixon, not 1830.lease_player]
    do:
      - set: [1830.lease_player, 1830.fog]
      - say: >-
          {asa} shrugs and counts a hundred in silver onto the agent's papers. The agent counts it again. "One hundred, against
          the note. The lessee's name?" "Not mine," says {asa}. "I'm
          for Galena." So the agent writes yours, though you couldn't run
          a ferry if your life depended on it. {ogee} looks away. Up the
          trail, a tall figure turns and walks back toward the camp. Then a
          chill comes off the river, and within a few breaths the fog is on you. {ogee's} voice comes from close by, flatter than before:
          "Easy now. Take my arm."
    else:
      - say: That would take {asa} and the agent in the same place.

  - id: follow_ogee
    phrases: [take ogee's arm, take his arm, take arm, follow ogee, follow him, stay close, go with ogee, take ferryman's arm, take the ferryman's arm, hold his arm, grab his arm, take his hand, hold on, hold on to him, go with him, follow ferryman, follow man, lead way, walk with ogee, walk with him, take ogee's hand, hold ogee's arm, take man's arm]
    when: [1830.fog]
    do:
      - clear: [1830.fog, present.planks, present.voice]
      - set: present.returned
      - say: >-
          You take {ogee's} arm and walk blind through the white, step by step. Somewhere along the way his hand lets go of your sleeve. The
          planks give way to concrete, the knocking fades, and the city sounds
          come back one by one. Your own clothes are back, and dry, and your
          pockets hold your phone and nothing else. Whatever you were carrying
          in 1830 has stayed there. You decide not to think about that either.
      - leave_behind: 1830
      - move: wateredge
    else:
      - say: There's nobody to follow just now.

  - id: go_to_museum
    phrases: [go to museum, go back to museum, return to museum, museum, go to historic center, walk to museum, go to margaret]
    when: [present.returned, {any: [in:wateredge, in:riverwalk]}, not present.planks]
    do:
      - say: You make your way back to the Historic Center, with the river walk and Hennepin passing in a blur of ordinary evening.
      - move: museum
    else:
      - when: [era:1830]
        say: The museum is a hundred and ninety-odd years off, give or take a fog.
      - say: The Historic Center is back along Hennepin; you'll have to walk it.

  - id: swim
    phrases: [swim, swim across, wade, wade in, cross river, swim river, wade across, jump in river, dive in]
    when: [{any: [in:landing, in:northlanding]}]
    do:
      - death: swim
    else:
      - when: [in:wateredge]
        say: You get as far as the bottom step, where the water turns out to be colder than a warm evening has any right to make it, and you think better of it.
      - say: There's no water here to drown in, which is something, at least.

# The veil. In 1830 the fog makes you look as if you belong: homespun, boots,
# and a phone that looks like a tin case to anyone else. Using it openly
# (these verbs, where someone can see) breaks that. Showing it to one person is
# discreet, so only they see; lighting it or taking pictures, everyone here
# sees. The first time, whoever saw goes cold (`cold`) until you leave the
# room; the second time, `again` runs. Ogee has seen it before.
veil:
  item: phone
  verbs: [show, photograph, light]
  warned: 1830.veil_warned
  exempt: [ogee]
  exempt_text: >-
    [ogee] glances at it, and then back at the river. "The last one had a
    thing like that," he says. "Put it away before somebody else sees it."
  react:
    dixon: >-
      [dixon] looks at the thing in your hand for a long moment. "I'd put that
      away," he says quietly, and turns back toward the river.
    rebecca: "[rebecca] stops stirring and looks at your hand, then at your face, and calls the children to her."
    james: "[james] goes pale and steps back behind the wagon."
    madeline: >-
      [madeline] makes a small sign with two fingers and steps between you and
      the boys. "Not here," she says.
    agent: "[agent] stares at it, then writes something on his papers, slowly, without taking his eyes off you."
    eli: >-
      [eli] scrambles back off the wagon tongue with his rifle half raised.
      "What is that?" he says, and nobody answers him.
    asa: >-
      [asa] stops swearing, which is somehow worse. "Whatever that is," he
      says, "keep it off my wagon."
    default: Whoever saw it goes very still, and then very busy somewhere else.
  warning: >-
    Out over the river the air thickens for a moment, as though something has noticed. You put the phone away. You'd better not do that again.
  cold:
    dixon: "[dixon] keeps his eyes on the river. \"Not now.\""
    madeline: "[madeline] shakes her head and keeps the boys behind her."
    agent: "[agent] goes on writing and doesn't answer."
    eli: "[eli] edges away along the wagon tongue."
    default: They won't meet your eye, and you'd do better to give it some time, somewhere else.
  again:
    - say: >-
        This time the fog doesn't wait. It comes up off the river all at once,
        thick and white and cold. The voices around you go thin and far away. When it clears, you're standing on concrete in your own dry clothes with your phone in your hand. Whatever you did in 1830 has come undone.
    - rewind: 1830
    - clear: [present.planks, present.voice]
    - move: wateredge

# NPCs who move between rooms. `at` is a variant list of rooms.
npcs:
  asa:
    name: Asa
    unknown: a big man in a sweat-dark shirt
    ref: the big man
    aliases: [asa, big man, man, uncle, wagon master, eli's uncle]
    at:
      - when: [1830.wagon_free]
        room: landing
      - room: slough
    room_line:
      - when: [1830.wagon_free]
        text: "[asa] leans on the nearest of his wagons, in a far better temper than you first found him."
      - text: "[asa] stands at the wheel, swearing at all of it."
    look:
      - when: [1830.wagon_free]
        text: He's a big man in a sweat-dark shirt with the mud drying on him to the thighs. For once he looks fairly pleased with the world.
      - text: He's a big man in a sweat-dark shirt, mud to the thighs, with the look of someone who has been losing an argument with a wagon since sunup.
    talk:
      - when: [not met.asa, 1830.wagon_free]
        text: >-
          "Asa," he says, and shakes your hand hard enough to hurt. "You're the one got me out of that slough." He jerks his head at the man on the crate. "That fella means to take the only boat on this river." He points at the flour he's hauling to Galena, then pats his coat, and something heavy inside it clinks. "I've got the silver. What I need is a ferry."
        do: [{set: [known.asa, met.asa, 1830.asa_needs_ferry]}]
      - when: [not met.asa]
        text: >-
          "Asa," he says, without letting go of the wheel. He nods at a bar lying snapped in two in the mud. "Get her out and there's a dollar in it."
        do: [{set: [known.asa, met.asa]}]
      - when: [1830.wagon_free, not 1830.asa_needs_ferry]
        text: >-
          "Out of the mud and into this," he says, with a jerk of his head at the man on the crate. "That fella means to take the only boat on this river." He points at the flour he's hauling to Galena, then pats his coat, and something heavy inside it clinks. "I've got the silver. What I need is a ferry."
        do: [{set: 1830.asa_needs_ferry}]
      - when: [1830.wagon_free]
        text: "\"I owe you. Anything you need, say so.\""
      - when: [1830.brush_placed]
        text: "\"That's the willow under her. Now something long under that axle.\""
      - text: "{asa} looks at you, then at the wagon. \"She ain't getting out by herself.\""
    topics:
      - keys: [wagon, wheels, slough, mud, stuck, bar, lever, brush]
        say:
          - when: [1830.wagon_free]
            text: "\"She's out and down at the landing, thanks to you. Next slough I see, I'm going around it.\""
          - when: [1830.brush_placed]
            text: "\"Willow's under her. Now something long under that axle.\""
          - text: "\"Down to the hubs, and the oxen can't shift her.\" He kicks one half of his broken bar further into the mud."

      - keys: [galena, diggings, mines, lead, flour, tools]
        say: "\"Flour and tools for the diggings. Galena pays in silver, so I haul to Galena, four or five runs a season.\""
      - keys: [agent, rolette, debt, notes, crate, coat]
        say:
          - when: [1830.wagon_free]
            text: "\"That fella wants a hundred in silver or he takes the boat.\" He pats his coat. \"I've got it. But I'm not paying another man's debt for nothing. Find me the man who means to run her, and we'll talk.\""
          - text: "\"Got a wagon in the mud. The ferry'll keep.\""
      - keys: [silver, money, cash, coin]
        say: "\"More than I like to carry on this road. Nobody out here takes paper.\""
      - keys: [dixon, lease, deal, hundred, help, crossings, tolls, pay, mail]
        say:
          - when: [1830.lease_dixon]
            text: "\"Dixon's square. My wagons cross free till the hundred's worked off.\""
          - when: [has:silver]
            text: "\"You've got it,\" {asa} says, with a nod at the bag. \"Dixon's up at the camp.\""
          - when: [1830.dixon_short, 1830.wagon_free]
            text: *deal
            do: *deal_do
          - when: [1830.wagon_free]
            text: "\"Dixon? The mail fella, up at the camp? If he means to run her, I want to hear what he's short of.\""
          - text: "\"Got a wagon in the mud. That's all the business I've got today.\""
      - keys: [eli, nephew, boy]
        say: "\"My sister's boy. His pa went with the militia in '27 and never came home.\" He's quiet a moment. \"Told her I'd see him to the diggings and back.\""
      - keys: [ferry, river, crossing, ogee]
        say:
          - when: [1830.rope_strung]
            text: "\"Ogee's got her going on a rope. Never seen the like.\""
          - text: "\"Nobody's crossing till the river drops anyhow.\""
    fallback: "{asa} spits into the mud. \"Couldn't tell you.\""
    social:
      hello: "{asa} grunts something that might be a greeting."
      thanks:
        - when: [1830.wagon_free]
          text: "\"It's me owes you.\""
        - text: "\"Thank me when she's out.\""
      bye: "\"Watch your boots.\""
      how: "\"Muddy. How's it look?\""
      sorry: "\"Nothing to be sorry for.\""
    parting:
      - when: [1830.wagon_free]
        text: "[asa] lifts a muddy hand as you go."
      - text: "[asa] grunts a goodbye without letting go of the wheel."

# What `help` says: the first entry whose `when` holds. Help is the one place
# the game may name commands outright.
hints:
  - when: [1830.fog]
    text: The fog has you. Take Ogee's arm.
  - when: [in:wateredge, present.voice]
    text: Someone is calling from the water. Answer him, or walk out toward him.
  - when: [in:wateredge, not 1830.lease_dixon]
    text: The water is hard to stop watching. Look at the water, or just wait a moment.
  - when: [era:1830, not 1830.met_ogee]
    text: Talk to the man in the buckskin shirt.
  - when: [era:1830, not 1830.rope_strung, not has:rope]
    text: Ogee needs Dixon's rope carried across the river. Dixon is camped up the trail, south past the cabin. Ask him for the rope.
  - when: [era:1830, not 1830.rope_strung, not has:paddle]
    text: You'll need a paddle. Madeline keeps a spare up at the cabin, under the eaves. Ask her for it.
  - when: [era:1830, not 1830.rope_strung, not 1830.canoe_tarred]
    text: Tar the canoe at the landing.
  - when: [era:1830, not 1830.rope_strung]
    text: Launch the canoe at the landing, then tie the rope to the post on the far bank.
  - when: [era:1830, not 1830.wagon_free, not has:pole]
    text: Eli's uncle Asa is stuck in the slough, south past Dixon's camp. He needs something under the wheels for grip and something long to lever with. Ask Ogee for his setting pole.
  - when: [era:1830, not 1830.wagon_free, not 1830.brush_placed, not has:brush, not has:axe]
    text: You'll need an axe to cut willow branches. There's one in the chopping block at the cabin, if you ask Madeline for it.
  - when: [era:1830, not 1830.wagon_free, not 1830.brush_placed, not has:brush]
    text: At the slough, cut willow branches with the axe.
  - when: [era:1830, not 1830.wagon_free, not 1830.brush_placed]
    text: Put the willow branches under the wagon's wheels.
  - when: [era:1830, not 1830.wagon_free]
    text: Lever the wagon out with Ogee's pole.
  - when: [era:1830, has:silver]
    text: Take Asa's silver up to Dixon at the camp, and give it to him. Not to the agent.
  - when: [in:camp, 1830.wagon_free, not 1830.key_returned, not 1830.key_lost]
    text: James Dixon, at the camp, has lost something. Talk to him.
  - when: [in:cabin, 1830.crow_traded, not has:key, not 1830.key_returned]
    text: The crow dropped James's key on the chopping block. Take it.
  - when: [in:cabin, 1830.wagon_free, 1830.key_lost, not 1830.key_returned, not 1830.crow_traded]
    text: The crow on the cabin roof has James's key. The boys say it only trades up, for something shinier. Asa's silver dollar is shiny. Put it on the chopping block.
  - when: [era:1830, has:key]
    text: Give the key back to James at the camp.
  - when: [era:1830, not 1830.dixon_short]
    text: Ask Dixon about the lease, and what's standing in his way.
  - when: [era:1830, not 1830.asa_needs_ferry]
    text: Talk to Asa at the landing. He carries silver, and he needs that ferry.
  - when: [era:1830]
    text: Asa needs the ferry running and Dixon needs a hundred in silver to run it. Tell Asa about Dixon.
  - when: [1830.lease_player]
    text: Something went wrong in 1830. Go back to the water's edge, wait for the fog, and cross again.
  - when: [chapter1.done]
    text: Chapter 1 is finished. Margaret has gone home; come back next Saturday.
  - when: [present.returned, 1830.lease_dixon]
    text: Go to the museum and talk to Margaret.
  - when: [in:riverwalk]
    text: Read the marker, then go down the steps to the water.
  - when: [in:street]
    text: Walk north up Hennepin to the river.
  - text: Margaret keeps mentioning the river and the marker. Talk to her, look around, then walk north up Hennepin to the river.
