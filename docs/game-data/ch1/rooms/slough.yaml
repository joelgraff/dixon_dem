id: slough
era: 1830
name: The slough, 1830
sources: [S4, S6]
picture: >-
  A rutted trail dipping into black mud between willows. A loaded supply wagon
  tilted to its hubs, four oxen straining, a big man in a sweat-dark shirt at
  the wheel.

# Asa is defined in chapter.yaml because he moves to the landing once freed.
# The return-visit description (see FORMAT.md, Rooms).
brief: "The trail sinks into black [mud] here between crowding [willows]."
look: >-
  Behind you the trail climbs back north toward {dixon's} camp. Here the
  [willows] crowd so close along its edges that there's no going round, and
  ahead the ruts vanish into black [mud].
listen:
  - when: [1830.wagon_free]
    text: Now that the oxen are gone you can hear the frogs, and water trickling back into the ruts.
  - text: Oxen are blowing, mud is sucking at their hooves, and over it all runs a steady and inventive stream of swearing.

nouns:
  wagon:
    name: mired wagon
    when: [not 1830.wagon_free]
    aliases: [mired wagon, stuck wagon, flour, sacks, tools, freight]
    room_line:
      - when: [1830.brush_placed]
        text: In the middle of it a loaded [wagon] sits down to its hubs on willow branches packed under its [wheels], while four [oxen] stand blowing in the traces.
      - text: In the middle of it a loaded [wagon] has gone down to its hubs. Four [oxen] stand blowing in the traces.
    look: The supply wagon is loaded with flour sacks and tools and tilted hard backwards, where the hind wheels have gone into the mud until the axle sits a hand's width below the surface.
    verbs:
      push: You put your shoulder to the tailboard while {asa} hollers the oxen up. The wheels only spin, throwing black mud over both of you, and the wagon doesn't move an inch.

  wheels:
    name: wheels
    when: [not 1830.wagon_free]
    aliases: [wheel, hind wheels, axle, hind axle, hubs]
    look:
      - when: [1830.brush_placed]
        text: The hind wheels sit on a mat of willow now. What's wanted is something long to lever the axle up.
      - text: The hind wheels are down to the hubs, with nothing under them for the oxen to pull against but more mud.

  oxen:
    name: oxen
    when: [not 1830.wagon_free]
    aliases: [ox, team, cattle, traces]
    look: The four oxen are mud to the shoulder, leaning into their yokes and getting nowhere. They look at you with a deep, wet resentment.
    verbs:
      push: You put your shoulder to the nearest ox, and it remains unmoved in every sense.

  mud:
    name: mud
    aliases: [black mud, ruts, slough, hole, ground]
    room_line:
      - when: [1830.shoe_lost, not has:shoe, not 1830.shoe_returned]
        text: Where the pole went in, the [mud] has a narrow hole in it.
    look:
      - when: [1830.shoe_lost, not has:shoe, not 1830.shoe_returned]
        text: The mud is black and cold and deep. Where the pole went in there's a narrow hole, slowly filling. Anything iron that came off would be down there still.
      - text: The mud is black and cold, and deep enough to lose a boot in.
    verbs:
      touch: It's cold, and it doesn't want to let go of your hand.

  willows:
    name: willows
    aliases: [willow, brush, saplings, willow brush, willow saplings]
    look: Willow saplings grow thick along the wet edges, whippy and straight. An armful of them would make good footing under a wheel.
    verbs:
      take: Willow is tougher than it looks, and you'd need an axe to cut it.

