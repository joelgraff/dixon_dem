id: slough
era: 1830
name: The slough, 1830
sources: [S4, S6]
picture: >-
  A rutted trail dipping into black mud between willows. A loaded supply wagon
  tilted to its hubs, four oxen straining, a big man in a sweat-dark shirt at
  the wheel.

# Asa is defined in chapter.yaml because he moves to the landing once freed.
look: >-
  A low wet stretch of the Peoria trail, where the ruts disappear into black
  [mud]. [willows] crowd the edges. The trail climbs back north toward
  {dixon's} camp.
listen:
  - when: [1830.wagon_free]
    text: Frogs, and water filling the ruts.
  - text: Oxen blowing, mud sucking at hooves, and a steady, inventive stream of swearing.

nouns:
  wagon:
    name: mired wagon
    when: [not 1830.wagon_free]
    aliases: [mired wagon, stuck wagon, flour, sacks, tools, freight]
    room_line:
      - when: [1830.brush_placed]
        text: A loaded [wagon] sits sunk to its hubs, willow brush packed under its [wheels], four [oxen] blowing in the traces.
      - text: A loaded [wagon] sits sunk to its hubs, four [oxen] blowing in the traces.
    look: A supply wagon loaded with flour sacks and tools, tilted hard where the hind wheels have gone into the mud. The hind axle is a hand below the surface.

  wheels:
    name: wheels
    when: [not 1830.wagon_free]
    aliases: [wheel, hind wheels, axle, hind axle, hubs]
    look:
      - when: [1830.brush_placed]
        text: The hind wheels sit on a mat of willow now. What's wanted is a long lever under the axle.
      - text: The hind wheels are down to the hubs. There's nothing under them for the oxen to pull against but more mud.

  oxen:
    name: oxen
    when: [not 1830.wagon_free]
    aliases: [ox, team, cattle, traces]
    look: Four oxen, mud to the shoulder, leaning into the yokes and getting nowhere. They look at you with deep, wet resentment.
    verbs:
      push: You put your shoulder to the nearest ox. It is unmoved, in every sense.

  mud:
    name: mud
    aliases: [black mud, ruts, slough, hole, ground]
    room_line:
      - when: [1830.shoe_lost, not has:shoe, not 1830.shoe_returned]
        text: Where the pole went in, the [mud] has a narrow hole in it.
    look:
      - when: [1830.shoe_lost, not has:shoe, not 1830.shoe_returned]
        text: Black, cold, and deep. Where the pole went in, there's a narrow hole, slowly filling. Something iron would be down there still.
      - text: Black and cold and deep enough to lose a boot in.
    verbs:
      touch: Cold, and it doesn't want to let go of your hand.

  willows:
    name: willows
    aliases: [willow, brush, saplings]
    look: Willow saplings, thick along the wet edges, whippy and straight. An armful would make good footing under a wheel.
    verbs:
      take: You'd need an axe. Willow is tougher than it looks.

actions:
  - id: cut_brush
    phrases: [cut brush, cut willows, cut willow, chop brush, chop willows, gather brush, cut saplings, chop willow, use axe on willows]
    when: [has:axe, not has:brush, not 1830.brush_placed, not 1830.wagon_free]
    do:
      - give: brush
      - set: 1830.has_brush
      - say: You hack an armful of willow and bundle it under one arm.
    else:
      - when: [{any: [has:brush, 1830.brush_placed]}]
        say: You've cut plenty.
      - when: [1830.wagon_free]
        say: The wagon's out. The willows can keep their brush.
      - say: Your hands aren't up to willow. You'd want an axe.

  - id: place_brush
    phrases: [put brush under wheels, put brush under wagon, put brush under wheel, use brush on wheels, lay brush, put brush in mud, place brush, put brush down, use brush]
    when: [has:brush, not 1830.wagon_free]
    do:
      - take: brush
      - set: 1830.brush_placed
      - say: "You pack the willow under the sunk wheels, as deep as you can shove it. \"Now the lever,\" says {asa}."
    else:
      - say: You've no brush to lay.

  - id: lever_wagon
    phrases: [lever wagon with pole, lever wagon, pry wagon, pry wagon with pole, use pole on wagon, push wagon with pole, lift axle, lever axle, use pole, put pole under axle, lift wagon]
    when: [has:pole, 1830.brush_placed, not 1830.wagon_free]
    do:
      - set: [1830.wagon_free, 1830.shoe_lost]
      - money: 40
      - say: >-
          You set the pole under the axle and heave. {asa} hollers the oxen up,
          the brush bites, and with a sound like a cork leaving a bottle the
          wagon lurches out onto firm ground. {asa} counts forty dollars in silver
          into your hand. "Earned," he says, and drives on toward the landing.
          The pole comes up lighter: its iron shoe is gone, somewhere in the
          mud.
    else:
      - when: [1830.wagon_free]
        say: The wagon's out and gone.
      - when: [not 1830.brush_placed]
        say: "{asa} waves you off. \"Brush under the wheels first, or you'll only drive her deeper.\""
      - say: You've nothing long enough for a lever. {asa's} bar is in two pieces in the mud.

  - id: dig_mud
    phrases: [dig in mud, search mud, feel in mud, look in mud, dig, reach into mud, search hole, dig in hole, reach in hole]
    when: [1830.shoe_lost, not has:shoe, not 1830.shoe_returned]
    do:
      - give: shoe
      - say: Up to the elbow in cold mud, you find it, a cone of forged iron, dented on one side.
    else:
      - say: Mud, just mud, all the way down.

exits:
  - names: [north, trail, camp, back, dixon's camp]
    to: camp
    peek: The trail climbs back north out of the wet toward {dixon's} camp.
    text: You climb out of the wet and walk back north to {dixon's} camp.
  - names: [south, peoria, trail south]
    blocked: The trail goes on south to Peoria, a long way off. Your business is back at the river.
