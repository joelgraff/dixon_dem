id: museum
era: present
name: "{town} Historic Center"
sources: [S1, S3, S4, S8]
picture: >-
  Small exhibit room seen from the entrance. Glass cases along the left wall,
  a row of framed photos above them, the founding panel on the far wall with a
  velvet pedestal beside it, a schoolhouse clock by a back door, the
  volunteer's desk in the right foreground, amber light from a side window.

look: >-
  The front room is quiet and a little too brightly lit. Fluorescent [lights]
  hum over a row of glass [cases] and a wall of framed [photos]. The founding
  [panel] takes up most of the far wall.
listen:
  - when: [1830.lease_dixon]
    text: The lights hum. By the back door a clock ticks, a little behind the others, as though it had never stopped.
  - text: The lights hum. By the back door, one clock is silent.

nouns:
  lights:
    name: lights
    aliases: [fluorescent lights, tubes, fluorescents, ceiling]
    look: Long fluorescent tubes, one flickering at the end of its run. The hum is the loudest thing in the room.

  panel:
    name: founding panel
    key: true
    aliases: [exhibit, founding, display, wall panel, founding exhibit, paragraph]
    on_look: [{set: present.panel_read}]
    look:
      - when: [1830.lease_dixon]
        text: >-
          THE FOUNDING OF DIXON. "Joseph Ogee kept a ferry here from about
          1828." It runs the full length of the panel now, and ends: "In April
          1830 John Dixon took over the ferry from Joseph Ogee, and the
          settlement took his name."
      - when: [1830.lease_player]
        text: >-
          THE FOUNDING OF THE LANDING. "Joseph Ogee kept a ferry here from
          about 1828. The ferry passed to a newcomer whose name was not
          recorded." After that the settlement simply stops.
      - text: >-
          THE FOUNDING OF ROLETTE. "Joseph Ogee kept a ferry here from about
          1828. In 1830 it passed to his creditor, the trader Rolette, and the
          crossing took his name." The paragraph ends a line short, as though
          the story wasn't finished.

  pedestal:
    name: pedestal
    aliases: [plinth, stand, velvet, ring, faded ring]
    reveals: [card]
    room_line:
      - when: [1830.lease_dixon, 1830.shoe_returned]
        text: Beside it, on the [pedestal], sits an iron [poleshoe|pole shoe].
      - text: Beside it a [pedestal] shows a faded ring pressed into its velvet.
    look:
      - when: [1830.lease_dixon, 1830.shoe_returned]
        text: On the velvet where there was only a faded ring this morning sits a corroded iron [poleshoe|pole shoe] from a river flatboat.
      - text: >-
          A waist-high pedestal with a ring pressed into its velvet, as if
          something heavy and round sat here for decades. A small typed [card]
          is propped against its base.
    verbs:
      touch:
        - when: [1830.lease_dixon, 1830.shoe_returned]
          say: The iron is cold and rough with old rust.
        - say: The velvet is cool and compressed into a perfect ring. Whatever sat here sat here a very long time.
      push: It doesn't budge. It's bolted to the floor.

  poleshoe:
    name: pole shoe
    when: [1830.lease_dixon, 1830.shoe_returned]
    aliases: [shoe, pole shoe, iron shoe, iron]
    look: >-
      A cone of forged iron, dented on one side. The new card reads: "Pole
      shoe from a river flatboat, c. 1830. Donor unknown." You know exactly
      where the dent came from.
    verbs:
      take: It belongs to the museum now, and Margaret is watching.

  card:
    name: typed card
    hidden: true
    when: [{any: [not 1830.lease_dixon, not 1830.shoe_returned]}]
    aliases: [label, note, typed card]
    look: >-
      The typed card, slightly crooked, reads: "Exhibit temporarily removed
      for conservation." Below it, in pencil, someone has written and half
      erased: ask Margaret.

  cases:
    name: glass cases
    aliases: [case, glass, glass cases, display case, arrowheads, pipe, ledger page]
    reveals: [emptycase]
    look:
      - when: [1830.lease_dixon]
        text: >-
          Arrowheads on cotton, a cracked clay pipe, a ledger page too faded to
          read. The cards under each are typed, not printed. The last case in
          the row, empty this morning, now holds a brass [token].
      - text: >-
          Arrowheads on cotton, a cracked clay pipe, a ledger page too faded to
          read. The cards under each are typed, not printed. The last case in
          the row is an [emptycase|empty case], its felt brushed and its glass
          wiped.
    verbs:
      open: The cases are locked. The little brass keyholes are clean, as if someone opens them often.

  emptycase:
    name: empty case
    hidden: true
    when: [not 1830.lease_dixon]
    aliases: [empty case, last case, bare case, empty]
    look: A case like the others, with a card holder and nothing in it. Somebody dusts it regularly, all the same.

  token:
    name: brass token
    when: [1830.lease_dixon]
    aliases: [brass token, ferry token]
    room_line: The last glass case holds a brass [token].
    look: >-
      A worn brass token stamped with a flatboat and the initials J.O. The new
      card reads: "Ferry token, c. 1830. Donor unknown."

  photos:
    name: photos
    aliases: [photo, photographs, pictures, frames, frame, wall of photos, mats, engraving]
    look:
      - when: [1830.lease_dixon]
        text: >-
          Mostly the twentieth century: a parade on Galena Avenue, the theatre
          marquee lit at night, a flooded riverbank with men in rowboats. One
          of the last two frames, empty this morning, holds an engraving of a
          flatboat and a tall man at its pole, cut from an old county atlas.
      - text: >-
          Mostly the twentieth century: a parade on Galena Avenue, the theatre
          marquee lit at night, a flooded riverbank with men in rowboats. The
          last two frames in the row are empty, just bare mats.

  clock:
    name: schoolhouse clock
    aliases: [schoolhouse clock, wall clock, back clock, tape, masking tape, back door]
    room_line:
      - when: [1830.lease_dixon]
        text: A schoolhouse [clock] ticks by the back door, a little behind.
      - text: A schoolhouse [clock] hangs silent by the back door.
    look:
      - when: [1830.lease_dixon]
        text: >-
          The schoolhouse clock by the back door is running. Its hands stand a
          few minutes past four, and it ticks a little behind the others. The
          masking tape, DO NOT WIND, has come loose at one end.
      - text: >-
          A schoolhouse clock by the back door, stopped at 4:17. Every other
          clock in the building runs a little fast or slow, but this one has
          stopped dead. A strip of masking tape on the case reads DO NOT WIND,
          in someone's careful hand.
    verbs:
      touch: The case is cool and slightly dusty.
      take: It's bolted to the wall.
      open: You'd have to wind it, and the tape says not to.

  desk:
    name: desk
    aliases: [volunteer desk, table, chair, blotter]
    look: >-
      A tidy desk, older than everything around it, with the usual [clutter]
      on top. The [guestbook] lies open at the corner nearest the door, and
      below the blotter the middle [drawer] has a small brass lock.
    verbs:
      sit: You glance at the chair. Margaret looks at you over her glasses, and you think better of it.

  clutter:
    name: desk clutter
    aliases: [coffee, cup, coffee cup, mints, roll of mints, lanyard]
    look: A lanyard, a roll of mints, and a cold cup of coffee with a lipstick ring on the lid. Margaret's, all of it.
    verbs:
      take: Margaret's mints are Margaret's mints.
      drink: It's cold, and it's hers.

  guestbook:
    name: guestbook
    key: true
    aliases: [book, register, guest book, log, pen, chain]
    pick:
      count: 3
      from:
        - "“Lovely little museum! — D. & S., Rockford.”"
        - "“Came for the Reagan boyhood home, stayed for the ferry. — Peoria.”"
        - "“My great-grandfather is in the 1912 photo, third from left. — K. Novak.”"
        - "“Cold in here. Good coffee, though.”"
        - "“Ohio sends its regards.”"
        - "“The little boy in the flood picture is my grandpa!”"
        - "“Where is the thing that goes on the pedestal?”"
        - "A child's drawing of a boat, signed with a crayon."
        - "“Fog again today.” No name, just the date in pencil."
      also:
        - when: [present.returned]
          from:
            - "In a hurried hand: “The river is not where it was.” It has been crossed out."
            - "“Does anyone else hear knocking down by the water?”"
            - "“Ask Margaret about the labels.” Nobody has signed it."
    look:
      - when: [present.signed]
        text: You page back through the recent entries. {picked} Your own name is there, in your own hand, under today's date.
      - text: You page back through the recent entries. {picked} A pen on a bead chain hangs beside it, for anyone who wants to leave their name.
    verbs:
      sign:
        - when: [present.signed]
          say: You've already signed. Your name sits there, a little smaller than you remember writing it.
        - say: You take the pen on its chain and sign your name under the last line. The ink is darker than you expected.
          do: [{set: present.signed}]
      close: You flip the cover shut, then open it again. It feels rude to hide it.

  drawer:
    name: locked drawer
    aliases: [middle drawer, lock, keyhole, drawers]
    look: A shallow middle drawer with a small brass lock, much older than the rest of the desk's hardware. The keyhole is worn bright.
    verbs:
      open: Locked. The other drawers slide out easily, full of staples and brochures, but not this one.
      push: It doesn't budge.
      search: The other drawers hold staples, brochures and a stapler. This one is locked.

  crossword:
    name: crossword
    key: true
    aliases: [puzzle, grid, clue, clues, seven down, newspaper, margin]
    on_look: [{set: present.crossword_read}]
    look:
      - when: [1830.lease_dixon]
        text: >-
          The crossword is finished, every square in neat pencil. Seven down,
          five letters, "Founder of the ferry town": DIXON. The letters cross
          cleanly. In the margin, rubbed nearly out: john, john, john.
      - when: [1830.lease_player]
        text: The crossword has gone soft. Half the squares are blank, and seven down has no clue at all, only a smudge where it was.
      - text: >-
          A newspaper crossword, nearly finished in neat pencil. Four across,
          four letters, "Rock River ferryman": OGEE, in ink. Seven down, five
          letters, "Founder of the ferry town," is blank, the squares rubbed
          raw from erasing. In the margin, over and over: john.
    verbs:
      touch: The paper is soft where the eraser has been. Margaret glances over, and you take your hand away.
      take: Margaret's hand covers it, politely.

  sign:
    name: hand-lettered sign
    when: [present.returned]
    aliases: [hand-lettered sign, labels sign]
    room_line: A hand-lettered [sign] is taped to the front of the desk.
    look: ASK ABOUT THE LATEST LABELS, in marker, taped to the front of the desk. Margaret's handwriting.

  window:
    name: window
    aliases: [view, pane, parking lot, light]
    room_line: Late light comes through the [window] the color of weak tea, and the glass [door] to the street has been propped open.
    look: A parking lot, the back of a neighbor's garage, and a power line with two crows on it. The light is going brown, and a thin haze sits low over the roofs.
    verbs:
      open: It's painted shut. The sash hasn't moved in decades.
      touch: The glass is cool and faintly damp on the outside.

  door:
    name: glass door
    aliases: [glass door, entrance, front door, wedge]
    look: Glass, propped open with a rubber wedge. The street beyond is warm and quiet.
    verbs:
      close: Margaret likes it open. You leave it.

  riverwalk:
    name: riverwalk
    hidden: true
    key: true
    aliases: [river walk, riverfront, river, walk]
    look: The riverfront walk Margaret mentioned, four blocks north up Hennepin. You can't see it from in here.

npcs:
  volunteer:
    name: Margaret
    unknown: a volunteer in a cardigan
    aliases: [margaret, volunteer, docent, woman, lady, name tag, nametag]
    room_line:
      - when: [present.returned]
        text: "[volunteer] sits behind the [desk] by the entrance, a [guestbook] at her elbow, frowning across the room at the panel."
      - text: "[volunteer] sits behind the [desk] by the entrance, a [guestbook] open at her elbow and a pencil moving slowly over a [crossword]."
    look:
      - when: [present.returned]
        text: Margaret, by her name tag. Sixty or so, reading glasses pushed up into grey hair. She is looking at the panel with her head tilted, the way you look at a picture hung slightly crooked.
      - text: A woman in a cardigan, sixty or so, reading glasses pushed up into grey hair. Her name tag says MARGARET. She works the crossword with the patience of long habit.
    talk:
      - when: [not known.volunteer]
        text: >-
          "Oh, hello. Have you been in before? You've a familiar face." She
          sets down her pencil. "I'm Margaret. I'm here Saturdays, mostly. Feel
          free to look around, and do sign the [guestbook] before you go."
        do: [{set: known.volunteer}]
      - when: [1830.lease_dixon, not chapter1.done]
        text: >-
          "You were in earlier, weren't you?" She frowns at the wall, then at
          the crossword, and something in her face settles. "Funny. I could
          swear the labels weren't like that this morning. Nobody's touched
          them." She taps the finished grid: DIXON. "Well. That's one done.
          Come by again, will you? I've a feeling the next puzzle won't be so
          easy."
        do: [{set: chapter1.done}]
      - when: [1830.lease_player]
        text: >-
          "Something's gone wrong," she says, before you can speak. "I think it
          went wrong at the river. Nobody can name the man who had that ferry,
          and it isn't right." She looks at you oddly. "If I were you I'd go
          back down and look at the water again. I don't know why I said
          that."
      - when: [chapter1.done]
        text: "\"Mm?\" She glances up from the finished grid. \"Isn't it odd, finishing something and not knowing what it was?\""
      - text: "She glances up from the crossword and smiles. \"Mm? Anything I can help with?\""
    topics:
      - keys: [fog, mist, haze, weather]
        say: "\"It's been coming off the river all week, odd for the time of year. Some evenings you can't see the far side from the walk. Burns off by morning, usually.\""
      - keys: [river, riverwalk, river walk, walk, outside, bank, marker]
        do: [{reveal: riverwalk}]
        say:
          - when: [1830.lease_dixon]
            text: "\"The riverwalk's the best of Dixon at this hour. Up Hennepin, four blocks north. The marker there reads properly now, I'm told.\""
          - text: >-
              "The [riverwalk]? Go up Hennepin, four blocks north. There's a
              marker there, Rolette's Ferry, and it's missing a line, if you
              ask me. People say if you watch the water long enough, you lose
              track of time." She goes back to her pencil. "Silly, I know."
      - keys: [ogee, joseph, ferryman]
        say:
          - when: [1830.lease_dixon]
            text: "\"Joseph Ogee. He kept the ferry before John Dixon took it over. Our panel gives him his due now. Funny, I'd have sworn it didn't.\""
          - text: "\"Joseph Ogee. He kept the ferry, and the whole town started at his dock. Then his debts caught up with him, the story goes. The panel stops short of whatever came after.\""
      - keys: [dixon, john, founder, founding, panel, exhibit]
        say:
          - when: [1830.lease_dixon]
            text: "\"John Dixon took over the ferry in 1830. Of course he did. Why did I ever think the panel ended anywhere else?\" She laughs, not quite convincingly."
          - when: [1830.lease_player]
            text: "\"A newcomer nobody can name. That isn't right. It isn't right at all.\""
          - text: "\"It ends mid-thought, doesn't it? Thirty-one years of Saturdays and I've never known what comes after. I keep writing a name in the margin, 'John', and then I can't think why.\""
      - keys: [rolette, creditor, trader, debts]
        say:
          - when: [1830.lease_dixon]
            text: "\"Rolette? A fur trader up at Prairie du Chien, I think. I can't imagine what he'd have to do with us.\""
          - text: "\"The fur trader. Held the ferryman's debts, the story goes, and got the ferry and the town's name for his trouble. I've never warmed to him.\""
      - keys: [crossword, puzzle, clue, seven, seven down, pencil, margin]
        say:
          - when: [1830.lease_dixon]
            text: "\"Dixon. Five letters. I couldn't get it all week. Look, it fits.\" She taps the grid."
          - when: [1830.lease_player]
            text: "\"The whole puzzle has gone to pieces. Seven down isn't even there any more.\""
          - text: "\"Seven down. 'Founder of the ferry town,' five letters. It's on the tip of my pencil, and then it slides right off. I keep writing the same name. John. Everyone would say Rolette, but that's seven letters.\""
      - keys: [pedestal, card, conservation, removed, shoe]
        say:
          - when: [1830.lease_dixon, 1830.shoe_returned]
            text: "\"That wasn't there this morning. An iron pole shoe, off a flatboat. I couldn't tell you where it came from.\" She doesn't sound as though she expects to be asked again."
          - text: "\"Empty since before my time. Conservation, the card says. I've never once seen anyone conserve anything.\" She smiles. \"I've never known what stood there, either.\""
      - keys: [photo, photos, frames, frame, picture, pictures, engraving]
        say:
          - when: [1830.lease_dixon]
            text: "\"One of the empty frames has an engraving in it now. Nobody told me.\""
          - text: "\"Those last two came back from the framer's in 'ninety-eight with nothing in them. Nobody ever filled them in.\""
      - keys: [clock, time, wind]
        say:
          - when: [1830.lease_dixon]
            text: "\"It started again this afternoon, all by itself. I'm choosing not to think about it.\""
          - text: "\"That clock's been stopped since before I started. The tape says not to wind it, so I don't.\""
      - keys: [desk, drawer, lock, key]
        say: "\"That desk came out of the old county clerk's office in the seventies. The drawers still work, except the locked one. I've always wondered what's in it.\""
      - keys: [case, cases, arrowheads, glass]
        say: "\"Locked since 1998. The key's with the board. The empty one at the end I dust every Saturday, out of habit.\""
      - keys: [guestbook, book, sign, visitors]
        say: "\"Everyone signs, even the ones who say they won't. Some of them write the oddest things.\""
      - keys: [lincoln, black hawk, fort, war, militia, "1832"]
        say: "\"The militia came through here in 1832, I'm told. Lincoln among them. They never fought a battle here. They just passed through.\""
      - keys: [labels, label, changed, different, change]
        say:
          - when: [present.returned]
            text: "She hesitates. \"I'd rather not say it out loud. The labels have changed, and nobody's touched them. That's all.\""
          - text: "\"Labels? They've been the same since the nineties.\""
      - keys: [museum, center, historic center, building, hours, collection]
        do: [{reveal: riverwalk}]
        say: "\"It's small, but it's ours. Most people come for the founding panel. If you want the rest of {town}, the best of it is outside. Take the [riverwalk].\""
      - keys: [familiar, before, met, remember, face]
        say: "\"I'd swear I've seen you somewhere. In a photograph, maybe.\" She shakes her head. \"Never mind me.\""
      - keys: [margaret, you, yourself, volunteer, saturdays]
        say: "\"Thirty-one years on Saturdays. Someone has to know where the stapler is.\""
    fallback: "\"Hm. I couldn't tell you. The library keeps the county histories, if you're curious.\""
    social:
      hello: "\"Hello, hello.\" She smiles over her glasses."
      thanks: "\"Oh, you're very welcome. Nobody thanks the volunteers. Not often.\""
      bye: "\"Mind the fog on your way. It comes up quick this time of year.\""
      how: "\"Can't complain. Quiet Saturday, a crossword, and someone to talk to. That's a good day.\""
      sorry: "\"Don't mention it.\""
    parting:
      - when: [present.returned]
        text: "You nod to [volunteer] on your way out. \"Take care out there,\" she says, still watching the panel."
      - text: "You thank [volunteer] and say you'll be back. \"Do come again,\" she says, pencil already moving. \"And mind the fog, it comes up quick.\""

exits:
  - names: [outside, out, door, street, leave, exit]
    to: street
    text: You step through the propped door and out onto the sidewalk. The hum of the fluorescents fades behind you.
