id: cabin
era: 1830
name: "{ogee's} cabin, 1830"
sources: [S1, S2]
picture: >-
  A single long log cabin with two doors and smoke from the chimney, in a
  clearing above the river. A woman in the left doorway, two boys at a
  chopping block in front, split oak stacked beside it, a canoe paddle
  hung on pegs under the eaves, trees behind.

# The return-visit description (see FORMAT.md, Rooms).
brief: "Smoke still threads up from the [cabin] chimney, and the wagon trail runs on south through the oaks."
look: >-
  One long log [cabin] fills the clearing, with a door at each end and a
  thread of smoke going straight up from its [chimney] into the still air.
  Behind you the [path] drops back to the river, and a wagon trail leads on
  south through the oaks.
listen: Someone is splitting kindling with quick, uneven strokes, a woodpecker is working somewhere in the trees, and below it all you can hear the river, the way you always can here.

nouns:
  paddle:
    name: paddle
    when: [not has:paddle]
    aliases: [canoe paddle, spare paddle, ash paddle, oar, pegs, eaves, father's paddle]
    room_line: Under the eaves, a canoe [paddle] hangs on a pair of wooden pegs.
    look: The paddle was carved from a single piece of ash, longer and narrower than you'd expect, and its grip has been worn dark and smooth by somebody's hands over a great many years. Whoever hung it on these pegs, out of the weather, meant to keep it.
    verbs:
      take:
        - when: [here:madeline]
          say: "{madeline} says, \"That was my father's,\" quietly, and you take your hand back. If you need it, you could ask her."
        - say: You'd want to ask before taking it down.

  crow:
    name: crow
    key: true
    aliases: [bird, big crow, roof, ridge, glint, something shiny, shiny thing, brass thing, key, brass key]
    room_line:
      - when: [not 1830.crow_traded]
        text: Up on the roof ridge a big [crow] keeps watch by the chimney, with something small glinting at its feet.
      - text: Up on the ridge, the [crow] turns a silver dollar over and over with its beak.
    look:
      - when: [not 1830.crow_traded]
        text: The crow is big and glossy, and it studies you with one eye and then the other. At its feet, wedged between two shingles, something small and brass winks in the light.
      - text: The crow is far too pleased with its silver dollar to pay you any attention.
    verbs:
      take: The crow watches you come, then hops a little further along the ridge, and the roof is no place for you to follow.
      climb: The roof is steep, the shingles are wet, and the crow would only move. You think better of it.
      touch: The crow is well out of reach, and it knows it.
      call: The crow looks at you, says something rude, and stays where it is.
      push: The crow is well out of reach, and it knows it.

  cabin:
    name: cabin
    aliases: [log cabin, doors, door, house]
    reveals: [westroom, eastroom]
    look: It is one long cabin of squared logs with a door at each end. The [westroom|west room] belongs to the family, and the [eastroom|east room], about eighteen feet square, is kept for travelers and hired help.
    verbs:
      open: Both doors already stand open to the spring air.
      smell: The cabin smells of woodsmoke and tallow, with wet wool drying somewhere inside.

  westroom:
    name: west room
    hidden: true
    aliases: [west room, family room, sitting room]
    look: Through the west door you can see the family's room, with two beds, a table and a few chairs, all of it kept neat. It isn't a room you'd walk into uninvited.
    verbs:
      search: You keep to the doorway, since it isn't your house to go through.

  eastroom:
    name: east room
    hidden: true
    aliases: [east room, travelers' room, travelers room, beds]
    look: The east room holds four beds for travelers. At the foot of one sits a carpetbag marked GALENA, with a good coat folded over it, so the agent must be lodging here.
    verbs:
      search: You leave the agent's bag alone. It's tempting, but it isn't yours.

  chimney:
    name: chimney
    aliases: [smoke, chimney smoke]
    look: The chimney is built of sticks and clay, and it draws well; the smoke goes straight up into the still air.

  block:
    name: chopping block
    aliases: [chopping block, stump, split oak, oak, stack, woodpile, wood]
    room_line:
      - when: [1830.has_axe]
        text: Beside a stack of split oak, the chopping [block] has no axe in it now.
      - text: An [axe] is sunk in the chopping [block] beside a stack of split oak.
    look: The block is an old stump worn smooth on top by years of axes, and beside it someone has stacked enough split white oak to last the summer.
    verbs:
      sit: You sit on the block for a moment, then think better of it and stand up again.

  axe:
    name: axe
    when: [not 1830.has_axe]
    aliases: [hatchet]
    look: The axe is old and its handle is dark with sweat, but the edge is still sharp enough to catch a thumbnail.
    verbs:
      take:
        - when: [not 1830.axe_ok]
          say: "{madeline} looks up from the door. \"That's ours,\" she says, not unkindly, and you leave it in the block. If you need it, you could ask."
        - say: You work the axe free of the block while {madeline} watches you do it.
          do: [{give: axe}, {set: 1830.has_axe}]

  path:
    name: path
    aliases: [river path]
    look: The path runs back down through the trees to the landing and the river.

  trail:
    name: wagon trail
    aliases: [trail, peoria trail, wagon trail, oaks]
    look: Wagon ruts run south through the oaks toward Peoria, and a little way along them the smoke of a cook fire rises between the trees.

npcs:
  madeline:
    name: Madeline
    unknown: a woman in a dark shawl
    ref: the woman in the shawl
    aliases: [madeline, woman, wife, madeline ogee, mrs. ogee]
    room_line: "[madeline] waits in the west doorway with a basket of mending on her hip, while two [boys|boys] split kindling by the block."
    look: She wears a dark dress and a shawl, with her sleeves pushed up from work, and she hasn't taken her eyes off you since you came into the clearing.
    talk:
      - when: [not met.madeline]
        text: "\"I'm Madeline Ogee. My husband keeps the ferry down below, and you'll be the one he fished out of the river, because you're dripping on my doorstep.\" She looks you over, from your wet hair down to your cracked boots, and leaves it at that."
        do: [{set: [known.madeline, met.madeline]}]
      - text: "{madeline} gives you a short nod and goes back to her mending."
    topics:
      - keys: [father, lasallier, trader, franklin creek, post]
        say: "\"My father keeps a post on Franklin Creek, up the river.\" She leaves it there."
      - keys: [ferry, burn, burned, bogardus, safe]
        say: "\"Nobody is going to burn this ferry.\" She says it as if she were telling you the time."
      - keys: [potawatomi, people, family, relatives]
        say: She looks at you for a long moment. "Ask me another time," she says, and it sounds like a door closing, politely.
      - keys: [boys, sons, children]
        say: "\"They're good boys, and they'll be better ones once they've split that pile.\""
      - keys: [agent, coat, rolette, debt, creditor, guest]
        say: "Her mouth thins. \"He eats at our table and sleeps in our east room, and all the while he means to take the boat. My husband says that's business.\""
      - keys: [joseph, ogee, husband]
        say: "\"He worries at that river like it owes him money.\" She pauses. \"It's the other way around.\""
      - keys: [paddle, oar, father's paddle, spare paddle, canoe paddle]
        say:
          - when: [has:paddle]
            text: "\"Bring it home when you're done with it.\""
          - text: "\"That was my father's.\" She looks at it for a moment, then reaches up and lifts it down from the pegs. \"He'd laugh to see it back on the water. Mind you bring it home.\""
            do: [{give: paddle}, {set: 1830.has_paddle}]
      - keys: [axe, borrow, chopping, block]
        say:
          - when: [has:axe]
            text: "\"You've got it. Just bring it back when you're done.\""
          - text: "\"Take it if you need it. Just bring it back.\""
            do: [{set: 1830.axe_ok}]
    fallback: "{madeline} only shakes her head; it isn't something she means to discuss with a stranger."
    social:
      hello: "{madeline} nods to you from the doorway."
      thanks: "\"Mm,\" she says, which seems to cover it."
      bye: She lifts a hand as you go.
      how: "\"Well enough, thank you.\""
      sorry: "\"It's nothing. Don't trouble yourself.\""
    parting: "[madeline] watches you all the way to the edge of the clearing."

  boys:
    name: boys
    plural: true                # "the boys are", in the return-visit line
    aliases: [boys, sons, children, kindling, two boys]
    look: Two boys are splitting kindling with a hatchet and more enthusiasm than skill. They stop to watch you, then pretend they weren't watching at all.
    talk:
      - when: [not 1830.crow_traded]
        text: "The older boy jerks his chin at the roof. \"He's a thief, that one. He's always finding something shiny.\" The younger one nods hard."
      - text: The boys look at each other and say nothing, though one of them can't quite hide a grin.
    topics:
      - keys: [crow, bird, thief, shiny, key, roof]
        say:
          - when: [not 1830.crow_traded]
            text: "\"He took Mother's thimble once,\" the younger boy says. \"Pa got it back with a brass button. He'll trade, but only up.\""
          - text: "\"You've made a friend for life,\" the older boy says, grinning."
    fallback: The boys giggle and go back to their kindling.

actions:
  - id: crow_trade
    phrases: [put dollar on block, put dollar on chopping block, put dollar down, lay dollar on block, leave dollar on block, leave dollar for crow, set dollar on block, set dollar on chopping block, put dollar on stump, toss dollar to crow, throw dollar to crow, show dollar to crow, offer dollar to crow, give dollar to crow, hold up dollar, offer crow dollar, give crow dollar, show crow dollar, trade dollar for key, trade dollar with crow, swap dollar for key, trade crow dollar, put silver dollar on block, put silver dollar on chopping block, put silver dollar down, lay silver dollar on block, leave silver dollar on block, leave silver dollar for crow, set silver dollar on block, set silver dollar on chopping block, put silver dollar on stump, toss silver dollar to crow, throw silver dollar to crow, show silver dollar to crow, offer silver dollar to crow, give silver dollar to crow, hold up silver dollar, offer crow silver dollar, give crow silver dollar, show crow silver dollar, trade silver dollar for key, trade silver dollar with crow, swap silver dollar for key, trade crow silver dollar, put silver on block, put silver on chopping block, put silver down, lay silver on block, leave silver on block, leave silver for crow, set silver on block, set silver on chopping block, put silver on stump, toss silver to crow, throw silver to crow, show silver to crow, offer silver to crow, give silver to crow, hold up silver, offer crow silver, give crow silver, show crow silver, trade silver for key, trade silver with crow, swap silver for key, trade crow silver, put coin on block, put coin on chopping block, put coin down, lay coin on block, leave coin on block, leave coin for crow, set coin on block, set coin on chopping block, put coin on stump, toss coin to crow, throw coin to crow, show coin to crow, offer coin to crow, give coin to crow, hold up coin, offer crow coin, give crow coin, show crow coin, trade coin for key, trade coin with crow, swap coin for key, trade crow coin, put money on block, put money on chopping block, put money down, lay money on block, leave money on block, leave money for crow, set money on block, set money on chopping block, put money on stump, toss money to crow, throw money to crow, show money to crow, offer money to crow, give money to crow, hold up money, offer crow money, give crow money, show crow money, trade money for key, trade money with crow, swap money for key, trade crow money, trade with crow, trade crow, bribe crow, make a trade]
    when: [money>=1, not 1830.crow_traded]
    do:
      - money: -1
      - set: [1830.crow_traded, 1830.has_key]
      - give: key
      - say: >-
          You set Asa's silver dollar on the chopping block and step back. The
          crow cocks its head, looks at the dollar, looks at you, and looks at
          the dollar again. Then it drops down off the roof in one black swoop,
          lets the brass thing fall from its beak onto the block to free it,
          snatches up the dollar instead, and is back on the ridge before you
          can blink. On the block lies a small brass key on a loop of greasy
          string.
    else:
      - when: [1830.crow_traded]
        say: The crow has what it wants, and so do you.
      - say: You've nothing shiny to offer it. The crow seems to know that.

  - id: borrow_paddle
    speaker: madeline
    phrases: [ask for paddle, borrow paddle, ask madeline for paddle, ask woman for paddle, ask her for paddle, ask madeline for the paddle, ask for the paddle, ask to borrow paddle, can i borrow paddle, may i borrow paddle, can i borrow the paddle, may i borrow the paddle, ask for spare paddle, ask for father's paddle, ask for oar, borrow oar]
    when: [here:madeline, not has:paddle]
    do:
      - give: paddle
      - set: 1830.has_paddle
      - say: "\"That was my father's.\" She looks at it for a moment, then reaches up and lifts it down from the pegs. \"He'd laugh to see it back on the water. Mind you bring it home.\""
    else:
      - when: [has:paddle]
        say: You already have the paddle.
      - say: There's nobody here to ask.

  - id: make_paddle
    phrases: [cut paddle, make paddle, carve paddle, split oak for paddle, chop paddle, make a paddle, cut a paddle, shape paddle, make paddle from oak, carve paddle from oak, cut paddle from oak, whittle paddle, carve a paddle, shape oak into paddle, make oar, cut oar, carve oar]
    do:
      - say: Carving a paddle out of firewood would take you the rest of the day, and these lengths are only two feet long anyway. Someone who lives on a river probably has a spare.

  - id: chop_wood
    phrases: [carve oak, use axe on oak, split oak, chop oak, cut oak, split oak with axe, shape oak, chop wood, cut wood, split wood, chop the wood, cut the wood, split the wood, chop log, chop logs, split log, split logs, chop the oak, split the oak, cut the oak, chop, use axe, use the axe, use axe on wood, use axe on block, use axe on log, chop firewood, chop a log, swing axe]
    when: [has:axe]
    do:
      - say: You split a few lengths of oak and add them to the pile, while the boys watch, unimpressed. It's honest work, and it gets you nothing but a sore shoulder.
    else:
      - say: You'd need an axe for that, and the only one here is sunk in the block.

  - id: borrow_axe
    speaker: madeline
    phrases: [ask for axe, borrow axe, ask madeline for axe, ask woman for axe, ask her for axe, ask madeline for the axe, ask to borrow axe, can i borrow axe, may i borrow axe, can i use axe, may i use axe, ask to use axe, ask madeline about axe, ask woman about axe]
    when: [here:madeline, not has:axe]
    do:
      - set: 1830.axe_ok
      - say: "\"Take it if you need it. Just bring it back.\""
    else:
      - when: [has:axe]
        say: You already have it.
      - say: There's nobody here to ask.

  - id: return_paddle
    speaker: madeline
    phrases: [return paddle, give paddle to madeline, give madeline paddle, give madeline the paddle, give paddle back, give paddle back to madeline, give back paddle, return paddle to madeline, put paddle back, hang paddle up, hang up paddle, hang paddle on pegs, put paddle on pegs, put paddle back on pegs, give her paddle, give her the paddle, give paddle to woman, give paddle, return oar, give oar to madeline, bring paddle home, give father's paddle back]
    when: [has:paddle, here:madeline]
    do:
      - take: paddle
      - set: 1830.paddle_returned
      - if:
          when: [1830.rope_strung]
          do:
            - say: "{madeline} takes it and runs her hand along the blade, where the river has left it dark. \"So it's been on the water again,\" she says, and something in her face softens before she hangs it back on its pegs under the eaves."
          else:
            - say: "{madeline} hangs it back on its pegs under the eaves. \"Back so soon? It'll be here if you want it.\""
    else:
      - when: [not has:paddle]
        say: You haven't got it.
      - say: There's nobody here to give it back to.

  - id: return_axe
    phrases: [give axe to madeline, return axe, give madeline axe, put axe back, give back axe, give axe back, give axe back to madeline, return axe to madeline, give axe to woman, put axe in block, give her axe, give her the axe]
    when: [has:axe, here:madeline]
    do:
      - take: axe
      - clear: 1830.has_axe
      - set: 1830.axe_returned
      - say: You hand the axe back. {madeline} looks along the edge, finds it no worse than she lent it, and sinks it back in the block.
    else:
      - say: You haven't got it to give back.

exits:
  - names: [north, path, river, landing, ferry, back, down]
    to: landing
    peek: The path runs back north through the trees, down to the river and the ferry landing.
    text: You head back down the path to the landing.
  - names: [south, trail, wagon trail, peoria trail, camp, fire]
    to: camp
    peek: The wagon trail runs south through the oaks toward the smoke of a cook fire.
    text: You follow the wagon ruts south through the oaks until you come to a camp.
