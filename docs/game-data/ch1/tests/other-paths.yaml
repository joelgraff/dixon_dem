    url: scene=cabin
    steps:
      - setup: {flags: [1830.arrived]}
      - {cmd: take axe, expect: [That's ours, you could ask], not: work the axe free}
      - {cmd: ask woman for axe, expect: Take it if you need it}
      - {cmd: take axe, expect: work the axe free}
      - {cmd: use axe on oak, expect: gets you nothing}
      - {cmd: return axe, expect: You hand the axe back}

