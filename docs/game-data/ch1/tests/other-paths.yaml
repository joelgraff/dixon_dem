      - {cmd: help, expect: Talk to the man in the buckskin shirt, not: Sit a moment}
      - {cmd: score, not: Sit a moment}
      - {cmd: wait, expect: [Sit a moment, world comes back]}
      - {cmd: wait, expect: Time passes, not: Sit a moment}

