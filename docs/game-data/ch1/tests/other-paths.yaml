    steps:
      - setup: {flags: [1830.arrived, known.ogee, met.ogee, 1830.met_ogee]}
      - {cmd: help, expect: [turn your back, tin case, No signal]}

  - name: the slough hint moves on with each step
    url: scene=slough
    steps:
