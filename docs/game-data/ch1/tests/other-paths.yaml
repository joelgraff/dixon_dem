      - setup: {items: [axe, pole]}
      - {cmd: help, expect: cut willow branches, not: Ask Ogee}
      - {cmd: cut brush, expect: willow}
      - {cmd: help, expect: Put the willow branches under}
      - {cmd: put brush under wheels, expect: Now the lever}
      - {cmd: help, expect: Lever the wagon out}

