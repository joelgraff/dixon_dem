      - {cmd: turn on flashlight, expect: writes something on his papers}
      - setup: {room: northlanding}
      - {cmd: turn on flashlight, expect: Nobody saw}
      - {cmd: take a picture of the post, expect: comes out about the way}
      - {cmd: call on phone, expect: nobody to call}
      - {cmd: look at tin, expect: tin case}

