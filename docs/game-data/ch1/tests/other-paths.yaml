      - {cmd: ask agent about asa, expect: wagons do not cross without this boat}
      - {cmd: tell asa about dixon, expect: what he's short of, not: season of crossings}
      - setup: {flags: [1830.key_returned, known.james, 1830.dixon_short, known.dixon, met.dixon]}
      - {cmd: ask asa about dixon, expect: [season of crossings, Take that up to Dixon]}

  - name: while you're still dazed, help and save work but don't use up the moment
