      - {cmd: look at crossword, expect: [seven down, john], score: 4}
      - {cmd: ask margaret about seven down, expect: [Margaret says, seven letters]}
      - {cmd: ask about the river, expect: [Rolette's Ferry, lose track of time]}
      - {cmd: sign guestbook, expect: darker than you expected, score: 6}
      - {cmd: look at clock, expect: "4:17"}
      - {cmd: go outside, expect: [You thank Margaret, West Fifth Street], room: street}
      - {cmd: look at pickup, expect: sticker}
      - {cmd: peel sticker, expect: "DIXON'S FERRY DAYS", score: 8}
