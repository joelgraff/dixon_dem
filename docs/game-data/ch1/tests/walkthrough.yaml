      - {cmd: look, expect: mist has lifted}
      - {cmd: go to museum, expect: Dixon Historic Center, room: museum}
      - {cmd: look, expect: [pole shoe, ticks by the back door, brass token]}
      - {cmd: talk to margaret, expect: [DIXON, next puzzle], score: 100}
      - {cmd: read panel, expect: took over the ferry}
      - {cmd: score, expect: Your score is 100 of 100}
