<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181a">
<title>Dixon Parser</title>
<style>
body { font-family: Georgia, "Times New Roman", serif; background: #16181a; color: #d8d4c8; margin: 0; }
main { max-width: 64rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
#layout { display: flex; gap: 1rem; align-items: flex-start; }
#play { flex: 1; min-width: 0; }
#notes { width: 16rem; height: 62vh; overflow-y: auto; border-top: 1px solid #333; border-bottom: 1px solid #333; padding: 0.5rem 0.8rem; font-size: 0.95rem; line-height: 1.4; }
#notes h2 { font-size: 0.8rem; font-weight: normal; letter-spacing: 0.12em; text-transform: uppercase; color: #8a867a; margin: 0.8rem 0 0.3rem; }
#notes h2.current { color: #d8d4c8; }
#notes details { margin: 0.15rem 0; }
#notes summary { cursor: pointer; color: #7ec8e3; text-transform: capitalize; }
#notes details p { margin: 0.3rem 0 0.6rem; color: #b8b4a8; }
#notes .empty { color: #6c685e; font-style: italic; }
#quick { display: none; gap: 0.4rem; margin-top: 0.6rem; overflow-x: auto; -webkit-overflow-scrolling: touch; }
#quick button { flex: none; padding: 0.55rem 0.8rem; min-height: 2.5rem; }
@media (pointer: coarse) { #quick { display: flex; } }
@media (max-width: 760px) {
  html, body { height: 100%; overscroll-behavior: none; }
  body { -webkit-text-size-adjust: 100%; }
  main { height: 100dvh; box-sizing: border-box; display: flex; flex-direction: column; padding: 0.5rem 0.7rem calc(0.6rem + env(safe-area-inset-bottom)); padding-left: max(0.7rem, env(safe-area-inset-left)); padding-right: max(0.7rem, env(safe-area-inset-right)); }
  h1 { margin: 0.3rem 0; }
  #layout { flex: 1; min-height: 0; flex-direction: column; gap: 0.5rem; }
  #play { flex: 1; min-height: 0; display: flex; flex-direction: column; width: 100%; }
  #output { flex: 1; height: auto; min-height: 0; padding: 0.4rem 0.2rem; font-size: 1rem; }
  #notes { width: auto; height: auto; max-height: 20dvh; flex: none; }
  #bar { margin-top: 0.5rem; }
  #cmd { font-size: 16px; padding: 0.7rem; }
  button { min-height: 2.75rem; }
  #settings { max-height: 40dvh; overflow-y: auto; }
}
#head { display: flex; justify-content: space-between; align-items: center; }
#gear { padding: 0.3rem 0.7rem; font-size: 0.9rem; }
#settings { display: none; background: #202325; border: 1px solid #444; padding: 0.8rem 1rem; margin-bottom: 1rem; font-size: 0.95rem; }
#settings.open { display: block; }
#settings label { display: block; margin: 0.4rem 0; cursor: pointer; }
#settings small { display: block; color: #8a867a; margin-left: 1.5rem; }
body.clicks .interactive { cursor: pointer; text-decoration: underline dotted; }
body.nosidebar #notes { display: none; }
h1 { font-weight: normal; letter-spacing: 0.15em; font-size: 1.1rem; color: #8a867a; text-transform: uppercase; }
#output { height: 62vh; overflow-y: auto; padding: 0.5rem 1rem; border-top: 1px solid #333; border-bottom: 1px solid #333; line-height: 1.55; font-size: 1.05rem; }
#output p { margin: 0 0 0.9rem; }
#output p.echo { color: #8a867a; font-family: monospace; margin-bottom: 0.4rem; }
#output p.heading { color: #8a867a; font-variant: small-caps; letter-spacing: 0.1em; margin-top: 1.6rem; }
body.hl-key .interactive.key, body.hl-all .interactive.key { color: #7ec8e3; }
body.hl-all .interactive.minor { color: #b7a77a; }
#notes .badge { color: #7ec8e3; font-size: 0.75em; margin-left: 0.3em; }
#bar { display: flex; gap: 0.5rem; margin-top: 1rem; }
#cmd { flex: 1; background: #202325; color: #e8e4d8; border: 1px solid #444; padding: 0.6rem; font-family: monospace; font-size: 1rem; }
button { background: #2a2e30; color: #d8d4c8; border: 1px solid #444; padding: 0.6rem 1rem; font-family: monospace; cursor: pointer; }
</style>
</head>
<body>
<main>
<div id="head"><h1>Dixon <span style="font-size:0.75em;letter-spacing:0.05em;text-transform:none">· old prototype · <a href="play.html" style="color:#7ec8e3">play the new version</a></span></h1><button id="gear" aria-expanded="false">Settings</button></div>
<div id="settings">
  <label><input type="checkbox" id="opt-sidebar"> Looked-at sidebar<small>Keeps a list of what you've examined, by scene.</small></label>
  <label>Highlighted words
    <select id="opt-hl">
      <option value="key">Key items only</option>
      <option value="all">All (key and minor, two colors)</option>
      <option value="off">Off</option>
    </select>
    <small>Key items (blue) are what move the story along. Minor items (tan) are just there to be looked at.</small>
  </label>
  <label><input type="checkbox" id="opt-clicks"> Clickable highlighted words<small>Click a highlighted word to examine it. Off by default; typing is the point.</small></label>
</div>
<div id="layout">
  <div id="play">
    <div id="output" aria-live="polite"></div>
    <div id="bar">
      <input id="cmd" maxlength="40" autocomplete="off" autocapitalize="off" autocorrect="off" enterkeyhint="go" spellcheck="false" placeholder="what do you do?" autofocus>
      <button id="enter">Enter</button>
    </div>
    <div id="quick" aria-label="Quick commands">
      <button data-run="look">look</button>
      <button data-run="north">N</button>
      <button data-run="south">S</button>
      <button data-run="east">E</button>
      <button data-run="west">W</button>
      <button data-run="up">up</button>
      <button data-run="down">down</button>
      <button data-fill="examine ">examine</button>
      <button data-fill="talk to ">talk</button>
      <button data-fill="ask about ">ask</button>
      <button data-run="inventory">inv</button>
      <button data-run="wait">wait</button>
      <button data-run="listen">listen</button>
      <button data-run="help">help</button>
    </div>
  </div>
  <aside id="notes" aria-label="Things you have looked at"></aside>
</div>
</main>
<script>
const output = document.getElementById('output');
const cmd = document.getElementById('cmd');

const settings = { sidebar: true, clicks: false, highlight: "key" };
try { Object.assign(settings, JSON.parse(localStorage.getItem("dixonSettings") || "{}")); } catch (e) {}

function applySettings() {
  if (typeof document.body === "undefined" || !document.body) return;
  document.body.classList.toggle("nosidebar", !settings.sidebar);
  document.body.classList.toggle("clicks", settings.clicks);
  document.body.classList.remove("hl-key", "hl-all");
  if (settings.highlight !== "off") document.body.classList.add("hl-" + settings.highlight);
  const hl = document.getElementById("opt-hl");
  if (hl) hl.value = settings.highlight;
  const sb = document.getElementById("opt-sidebar"), ck = document.getElementById("opt-clicks");
  if (sb) sb.checked = settings.sidebar;
  if (ck) ck.checked = settings.clicks;
  try { localStorage.setItem("dixonSettings", JSON.stringify(settings)); } catch (e) {}
}

const state = {
  scene: "museum",
  money: 0,
  hasLand: false,
  hasFerry: false,
  hasAxe: false,
  dixonOwns: false,
  dixonCash: 260,
  warnedClaim: false,
  visited1830: false,
  returned: false,
  ogeeIntroduced: false,
  turnsHere: 0,
  shift: 0,
  fog: false,
  volunteerSpoke: false,
  signed: false,
  found: {},
  parted: {},
  notes: {},
  visitedScenes: []
};

const esc = t => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function keyOf(type, entry) {
  if (entry.key !== undefined) return entry.key;
  return type === "npc" || !!(entry.reveals && entry.reveals.length);
}

function isKeyNoun(noun, sceneId) {
  const sc = scenes[sceneId];
  if (!sc) return false;
  const n = noun.toLowerCase();
  const hit = (key, e) => key === n || (e.aliases || []).includes(n) || (e.name && e.name.toLowerCase() === n);
  for (const [k, o] of Object.entries(sc.objects)) if (hit(k, o) && keyOf("object", o)) return true;
  for (const [k, o] of Object.entries(sc.npcs || {})) if (hit(k, o)) return true;
  return sc.exits.some(e => e.names.includes(n));
}

const fmt = (t, sceneId) => esc(t).replace(/\[([^\]]+)\]/g, (m, noun) =>
  `<span class="interactive ${isKeyNoun(noun, sceneId || state.scene) ? "key" : "minor"}" data-noun="${noun}">${noun}</span>`).replace(/\n/g, "<br>");

function print(text, cls) {
  output.innerHTML += `<p${cls ? ` class="${cls}"` : ""}>${fmt(text)}</p>`;
  output.scrollTop = output.scrollHeight;
}

function phoneText() {
  const fog = state.scene === "riverbank" ? state.turnsHere : 0;
  if (state.scene === "ferry" || state.scene === "farbank" || state.scene === "cabins" || (state.scene === "riverbank" && state.shift >= 1)) {
    return "The screen is black. When you hold the button it lights for a moment — no bars, no clock, only a thin line where the battery should be — then it goes dark again.";
  }
  if (fog >= 4) return "The screen is dim and the bars are gone. The clock reads 4:17 and does not change while you watch it.";
  if (fog >= 2) return "The signal is down to one bar and flickering. The mist has beaded on the glass.";
  if (done()) return "Battery at 58 percent, full signal. The clock reads 4:21 and, while you watch, turns to 4:22.";
  return "Battery at 61 percent, full signal. Nothing new.";
}

function guestEntries() {
  const entries = [
    "“Lovely little museum! — D. & S., Rockford.”",
    "“Came for the Reagan boyhood home, stayed for the ferry. — Peoria.”",
    "“My great-grandfather is in the 1912 photo, third from left. — K. Novak.”",
    "“Cold in here. Good coffee, though.”",
    "“Ohio sends its regards.”",
    "“The little boy in the flood picture is my grandpa!”",
    "“Where is the thing that goes on the pedestal?”",
    "A child's drawing of a boat, signed with a crayon.",
    "“Fog again today.” No name, just the date in pencil."
  ];
  if (state.visited1830) {
    entries.push(
      "In a hurried hand: “The river is not where it was.” It has been crossed out.",
      "“Does anyone else hear knocking down by the water?”",
      "“Ask Margaret about the labels.” Nobody has signed it."
    );
  }
  return entries;
}

const FERRY_PRICE = 360;
const done = () => state.returned && state.dixonOwns;
const wrongFix = () => state.returned && state.hasFerry && !state.dixonOwns;
const townName = () => done() ? "Dixon" : "Ogee's Landing";

const scenes = {
  museum: {
    get name() { return townName() + " Historic Center"; },
    look: () => {
      let text = "The front room is quiet and a little too brightly lit. Fluorescent tubes hum over a row of glass [cases] and a wall of framed [photos]. The founding [exhibit] takes up most of the far wall, and beside it a [pedestal] stands with a faded ring pressed into its velvet where something used to sit. A schoolhouse [clock] hangs by the back door.\n\n";
      text += state.returned
        ? "A [volunteer] in a cardigan sits behind the [desk] by the entrance, a [guestbook] open at her elbow, frowning across the room at the exhibit panel. "
        : "A [volunteer] in a cardigan sits behind the [desk] by the entrance, a [guestbook] open at her elbow and a pencil moving slowly over a [crossword]. ";
      text += "Late light comes through the [window] the color of weak tea, and the glass door to the street has been propped open.";
      return text;
    },
    listen: () => done() ? "The lights hum. In the back a clock ticks, a little behind the others, as though it had never stopped." : "The lights hum. In the back, one clock is silent.",
    extras: {
      drawer: "The desk has a [drawer] with a small brass lock.",
      card: "A small typed [card] is propped against the pedestal."
    },
    objects: {
      exhibit: {
        key: true,
        aliases: ["panel", "founding", "display", "wall"],
        desc: () => {
          if (done()) return "The panel is whole. THE FOUNDING OF DIXON. It ends: “In April 1830 John Dixon bought the ferry from Joseph Ogee, and the settlement took his name.” The last glass case holds a small brass token where there was only felt before." + (state.hasLand ? " A surveyor's claim receipt is pinned beside the panel: a thirty-two-acre ridge timber claim, claimant unknown." : "");
          if (wrongFix()) return "The panel is worse. THE FOUNDING OF OGEE'S LANDING, and then a few lines that trail off. A new sentence has been added: the ferry passed to a newcomer in 1830, whose name was not recorded. After that the settlement simply stops.";
          return "A wall panel and a small case, titled THE FOUNDING OF OGEE'S LANDING. “Joseph Ogee kept a ferry on the Rock River from about 1828. A post office and a few cabins grew up beside it.” The paragraph ends a line short, as though the story wasn't finished.";
        }
      },
      clock: {
        aliases: ["schoolhouse clock", "back clock", "wall clock", "clocks"],
        desc: () => done()
          ? "The schoolhouse clock by the back door is running. Its hands stand a few minutes past four, and it ticks a little behind the others. The strip of masking tape on the case, DO NOT WIND, has come loose."
          : "A schoolhouse clock by the back door, stopped at 4:17. Every other clock in the building runs a little fast or slow, but this one has stopped dead. A strip of masking tape on the case reads DO NOT WIND, in someone's careful hand.",
        verbs: { touch: "The case is cool and slightly dusty.", take: "It's bolted to the wall.", open: "You'd have to wind it, and the tape says not to." }
      },
      crossword: {
        key: true,
        aliases: ["puzzle", "grid", "clue", "clues", "seven down", "crosswords", "newspaper"],
        desc: () => done()
          ? "The crossword is finished, every square in neat pencil. Seven down, five letters, “Founder of the ferry town”: DIXON. The letters cross cleanly. In the margin, rubbed nearly out: john, john, john."
          : wrongFix()
            ? "The crossword has gone soft. Half the squares are blank, and seven down has no clue at all, only a smudge where it was."
            : "A newspaper crossword, nearly finished in neat pencil. Four across, four letters, “Rock River ferryman”: OGEE, in ink. Seven down, five letters, “Founder of the ferry town,” is blank, the squares rubbed raw from erasing. In the margin, over and over: john.",
        verbs: { touch: "The paper is soft where the eraser has been. Margaret glances over, and you take your hand away.", take: "Margaret's hand covers it, politely." }
      },
      cases: {
        key: false,
        aliases: ["case", "glass", "glass cases", "display case"],
        desc: () => "Arrowheads on cotton, a cracked clay pipe, a ledger page too faded to read. The cards under each are typed, not printed. " + (done()
          ? "The last case in the row, empty before, now holds a brass [token]."
          : "The last case in the row is an [empty case], the felt brushed and the glass wiped."),
        reveals: ["emptycase"],
        verbs: { open: "The cases are locked. The little brass keyholes are clean, as if someone opens them often." }
      },
      emptycase: {
        hidden: true,
        title: "empty case",
        aliases: ["empty case", "bare case", "last case", "empty", "token", "brass token", "something"],
        desc: () => done()
          ? "On the felt that was bare this morning, a worn brass token stamped with a flatboat and the initials J.O. The card holder now has a card: “Ferry token, c. 1830. Donor unknown.”"
          : "A case like the others, with a card holder and nothing in it. The card holder is empty too. Somebody dusts it regularly, all the same."
      },
      card: {
        hidden: true,
        aliases: ["label", "note"],
        desc: "The typed card, slightly crooked, reads: “Exhibit temporarily removed for conservation.” Below it, in pencil, someone has written and half erased: ask Margaret."
      },
      photos: {
        aliases: ["photo", "photographs", "pictures", "frames", "wall of photos"],
        desc: () => {
          let text = "Mostly the twentieth century: a parade on Galena Avenue, the theatre marquee lit at night, a flooded riverbank with men in rowboats. The last two frames in the row are empty, just bare mats.";
          if (done()) text = text.replace("The last two frames in the row are empty, just bare mats.", "One of the last two frames, empty before, now holds a faded print of a flatboat and a tall man in a dark coat at its pole. The label says: John Dixon at his ferry, 1830s.");
          else if (state.returned && state.hasLand) text = text.replace("The last two frames in the row are empty, just bare mats.", "One of the last two frames, empty before, now holds a survey plat of a ridge lot, labeled Unknown claimant.");
          return text;
        }
      },
      pedestal: {
        key: false,
        aliases: ["empty", "stand", "plinth"],
        desc: () => {
          if (done()) return "On the velvet where there was only a faded ring, a corroded iron pole-shoe from a river flatboat. The card says: “Donor unknown.”";
          return "A waist-high pedestal with a ring pressed into its velvet, as if something heavy and round sat here for decades. A small typed [card] is propped against its base.";
        },
        reveals: ["card"],
        verbs: {
          touch: "The velvet is cool and compressed into a perfect ring. Whatever sat here sat here a very long time.",
          push: "It doesn't budge. It's bolted to the floor."
        }
      },
      desk: {
        key: false,
        aliases: ["volunteer desk", "table", "chair"],
        desc: () => "A tidy desk, older than everything around it: a lanyard, a roll of mints, a cold cup of coffee with a lipstick ring on the lid" + (state.returned ? ", and a hand-lettered sign reading ASK ABOUT THE LATEST LABELS" : "") + ". A [guestbook] lies open at the corner nearest the door, and below the blotter the middle [drawer] has a small brass lock.",
        reveals: ["guestbook", "drawer"],
        verbs: { sit: "You glance at the chair. Margaret looks at you over her glasses and you think better of it." }
      },
      drawer: {
        aliases: ["middle drawer", "lock", "keyhole"],
        desc: "A shallow middle drawer with a small brass lock, much older than the rest of the desk's hardware. The keyhole is worn bright.",
        verbs: {
          open: "Locked. The other drawers slide out easily, full of staples and brochures, but not this one.",
          push: "It doesn't budge.",
          search: "The other drawers hold staples, brochures, and a stapler. This one is locked."
        }
      },
      guestbook: {
        key: true,
        aliases: ["book", "register", "guest book", "log"],
        desc: () => {
          const pool = guestEntries();
          const picks = pool.sort(() => Math.random() - 0.5).slice(0, 3);
          let text = "You page back through the recent entries. " + picks.join(" ");
          if (state.signed) text += " Your own name is there, in your own hand, under the date.";
          return text + " A pen on a bead chain hangs beside it, for anyone who wants to leave their name.";
        },
        verbs: {
          sign: () => {
            if (state.signed) return "You've already signed. Your name sits there, a little smaller than you remembered writing it.";
            state.signed = true;
            return "You take the pen on its chain and sign your name under the last line. The ink is darker than you expected.";
          },
          read: () => scenes.museum.objects.guestbook.desc(),
          close: "You flip the cover shut, then open it again; it feels rude to hide it."
        }
      },
      riverwalk: {
        key: true,
        hidden: true,
        aliases: ["river walk", "riverfront", "river", "walk"],
        desc: "The riverfront walk Margaret mentioned, four blocks north up Hennepin. You can't see it from in here.",
        verbs: { touch: "It's four blocks away." }
      },
      window: {
        aliases: ["view", "pane"],
        desc: "A parking lot, the back of a neighbor's garage, and a power line with two crows on it. The light is going brown, and a thin haze sits low over the roofs.",
        verbs: {
          open: "It's painted shut. The sash hasn't moved in decades.",
          touch: "The glass is cool and faintly damp on the outside.",
          sit: "There's no sill deep enough to sit on."
        }
      }
    },
    npcs: {
      volunteer: {
        name: "the volunteer",
        aliases: ["docent", "woman", "lady", "margaret"],
        desc: () => state.returned
          ? "Margaret, by her name tag: sixty or so, reading glasses pushed up into grey hair. She is looking at the exhibit panel with her head tilted, the way you look at a picture hung slightly crooked."
          : "A woman in a cardigan, sixty or so, reading glasses pushed up into grey hair. Her name tag says MARGARET. She sits at the [desk] working the crossword with the patience of long habit.",
        talk: () => {
          if (state.returned) {
            if (state.volunteerSpoke === "back") return done()
              ? "“Mm?” Margaret glances up. “Sorry. Still looking at seven down. Isn't it odd, finishing something and not knowing what it was?”"
              : "“Mm?” Margaret glances up. “Sorry. Still thinking about the labels.”";
            state.volunteerSpoke = "back";
            return done()
              ? "“Oh, hello again. You were in earlier, weren't you?” She frowns at the wall, then at the crossword, and something in her face settles. “Funny. I could swear the labels weren't like that this morning. Nobody's touched them.” She taps the finished grid. “Well. That's one done. Come by again, will you? I've a feeling the next puzzle won't be so easy.”"
              : "“Oh, hello again. You were in earlier, weren't you?” She frowns at the wall. “Funny. I could swear the labels weren't like that this morning. Nobody's touched them.” She laughs, not quite convincingly.";
          }
          if (state.volunteerSpoke) return "Margaret glances up from the crossword and smiles. “Mm?”";
          state.volunteerSpoke = true;
          reveal(["guestbook"]);
          return "“Oh, hello! I'm Margaret. I'm here Saturdays, mostly.” She sets down her pencil. “Feel free to look around. And if you like, sign the [guestbook] before you go. We like to know who's been in.”";
        },
        fallback: "“Hm. I couldn't tell you. I'm afraid I couldn't say. You could try the front office on a weekday.”",
        topics: [
          { keys: ["fog", "mist", "haze", "weather"], say: "“It's been coming off the river all week, odd for the time of year. Some mornings you can't see the far side from the walk.” She glances at the window, then back at her crossword. “Burns off by noon, usually.”" },
          { keys: ["river", "walk", "riverwalk", "river walk", "outside", "bank", "evening", "stroll", "path"], reveals: ["riverwalk"], say: () => "“The [riverwalk]? It's the best of " + townName() + " at this hour. Go up Hennepin, four blocks north. There's a marker there, Ogee's Ferry. Most people walk right past it.” She glances toward the window, though it only faces the parking lot. " + (done() ? "“The fog's been coming off the water all week. Odd, for the time of year.”" : "“Seven down has been bothering me all week, and the marker's missing a line, if you ask me. People say if you look at the water long enough, you lose track of time.” She goes back to her pencil. “Silly, I know.”") },
          { keys: ["ogee", "joseph"], say: () => done() ? "“Joseph Ogee. He ran a ferry here before John Dixon bought it. Our panel gives him a line now. Funny, I'd have sworn it didn't.”" : "“Joseph Ogee. He kept the ferry, and the whole town started at his dock. Our panel stops short of what came next. The marker by the river does a little better.”" },
          { keys: ["dixon", "john", "founder", "founding", "exhibit", "panel", "ferry"], say: () => done() ? "“John Dixon bought the ferry in 1830. Of course he did. Why did I ever think the panel ended anywhere else?” She laughs, not quite convincingly." : wrongFix() ? "“Now there's a newcomer nobody can name. That isn't right. It isn't right at all.”" : "“It ends mid-thought, doesn't it? Thirty-one years of Saturdays and I've never known what comes after Ogee. I keep writing a name in the margin, ‘John’, and then I can't think why.”" },
          { keys: ["crossword", "puzzle", "clue", "seven", "pencil", "margin"], say: () => done() ? "“Seven down. Dixon, five letters. I couldn't get it all week. Look, it fits.” She taps the grid." : wrongFix() ? "“The whole puzzle has gone to pieces. Seven down isn't even there any more.”" : "“Seven down. ‘Founder of the ferry town,’ five letters. It's on the tip of my pencil, and then it slides right off.” She taps the margin. “I keep writing the same name there. John.”" },
          { keys: ["pedestal", "removed", "conservation", "card"], say: () => done() ? "“That wasn't there this morning. It's an iron pole-shoe, off a flatboat. I couldn't tell you where it came from.” She doesn't sound as though she expects to be asked again." : "“Empty since before my time. Conservation, the card says. I've never once seen anyone conserve anything.” She smiles. “I've never known what stood there, either.”" },
          { keys: ["photo", "frames", "mats", "frame", "picture"], say: () => state.returned && (state.hasLand || state.dixonOwns) ? "“One of the empty frames has something in it now. Nobody told me.”" : "“Those last two came back from the framer's in 'ninety-eight with nothing in them. Nobody ever filled them in.”" },

function scene() { return scenes[state.scene]; }

function visible(entry) { return (!entry.visible || entry.visible()); }

function isFound(key) { return state.found[state.scene + ":" + key]; }

function reveal(keys) {
  (keys || []).forEach(k => { state.found[state.scene + ":" + k] = true; });
}

function describe(entry) { return typeof entry.desc === "function" ? entry.desc() : entry.desc; }

function editDistance(a, b) {
  const row = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let diagonal = row[0];
    row[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const above = row[j];
      row[j] = Math.min(row[j] + 1, row[j - 1] + 1, diagonal + (a[i - 1] === b[j - 1] ? 0 : 1));
      diagonal = above;
    }
  }
  return row[b.length];
}

function candidates() {
  const s = scene();
  const list = [];
  for (const [key, obj] of Object.entries(s.objects)) {
    if (visible(obj) && (!obj.hidden || isFound(key))) list.push({ type: "object", key, entry: obj, labels: [key, ...(obj.aliases || [])] });
  }
  for (const [key, npc] of Object.entries(s.npcs || {})) {
    if (visible(npc)) list.push({ type: "npc", key, entry: npc, labels: [key, npc.name.toLowerCase(), ...(npc.aliases || [])] });
  }
  list.push({ type: "item", key: "phone", entry: { desc: phoneText }, labels: ["phone", "cell", "cellphone", "mobile"] });
  if (state.hasAxe) list.push({ type: "item", key: "axe", entry: { desc: "A worn axe, heavier than it looks." }, labels: ["axe", "hatchet"] });
  return list;
}

function cleanName(name) {
  name = name.toLowerCase().trim();
  let prev;
  do {
    prev = name;
    name = name.replace(/^(the|a|an|at|to|in|on|out of|out|through|thru|inside|behind|under|around|over|into|up)\s+/, "");
  } while (name !== prev);
  return name;
}

function findTarget(name) {
  name = cleanName(name);
  const matches = candidates();
  const exact = matches.filter(m => m.labels.includes(name));
  if (exact.length === 1) return exact[0];
  if (exact.length > 1) return { type: "ambiguous", candidates: exact.slice(0, 2) };
  const scored = matches.map(m => ({ ...m, distance: Math.min(...m.labels.map(label => editDistance(name, label))) })).sort((a, b) => a.distance - b.distance);
  if (name.length >= 4 && scored.length && scored[0].distance <= 1) {
    const best = scored.filter(m => m.distance === scored[0].distance);
    return best.length === 1 ? best[0] : { type: "ambiguous", candidates: best.slice(0, 2) };
  }
  if (name.length >= 4 && scored.length && scored[0].distance <= 2) return { type: "suggestions", candidates: scored.slice(0, 2) };
  return null;
}

function clarify(found) {
  const names = found.candidates.map(c => c.key).join(" or ");
  print(found.type === "ambiguous" ? `Which do you mean: ${names}?` : `I don't see that exactly. Did you mean ${names}?`);
}

const DIRS = { n: "north", s: "south", e: "east", w: "west", u: "up", d: "down" };

function findExit(name) {
  name = name.toLowerCase().trim();
  let prev;
  do { prev = name; name = name.replace(/^(?:the|to|toward|towards|into|through|down|up|along|onto|on|over|across|back to|back)\s+/, ""); } while (name !== prev && name);
  name = DIRS[name] || name;
  return scene().exits.find(e => e.names.includes(name));
}

function look() {
  const s = scene();
  let text = s.look();
  const extras = Object.entries(s.extras || {}).filter(([k]) => isFound(k)).map(([, t]) => typeof t === "function" ? t() : t).filter(Boolean);
  if (extras.length) text += " " + extras.join(" ");
  if (state.fog && PAST.includes(state.scene) && state.scene !== "ferry") text += " The fog has closed in around you, thick and white, and a rough hand has found your sleeve.";
  print(text);
}

const PAST = ["ferry", "farbank", "cabins"];

function chapterEnd() {
  if (!(state.dixonOwns || state.hasFerry) || state.fog || !PAST.includes(state.scene)) return;
  state.fog = true;
  print("A chill comes up off the river. Within a few breaths the fog is on you, thick and white and wet, and you can no longer see your own hands. Out of it, Ogee's voice, close by: “Easy now. Don't go wandering in this. Stay where you are, and take my arm.” A rough hand finds your sleeve.");
}

function followOgee() {
  if (!state.fog) return print("There's nobody to follow right now.");
  state.returned = true; state.shift = 0; state.fog = false;
  arrive("riverbank", "You take Ogee's arm and walk blind through the white, step by step. His hand lets go of your sleeve somewhere along the way. The planks give way to concrete, the knocking fades, and the city sounds come back one by one. The museum is a short walk; Margaret will want to hear about it. (Say “go to museum”.)");
}

function arrive(id, text, onArrive) {
  state.scene = id;
  state.turnsHere = 0;
  state.parted = {};
  if (!state.visitedScenes.includes(id)) state.visitedScenes.push(id);
  if (onArrive) onArrive();
  if (text) print(text);
  print(scene().name, "heading");
  look();
  renderNotes();
}

function move(exit) {
  if (state.fog && PAST.includes(state.scene)) {
    print("The fog is too thick to go anywhere. You take a step and lose all sense of direction, and Ogee's hand tightens on your sleeve. “Not that way. Follow me.”");
    return true;
  }
  const blocked = typeof exit.blocked === "function" ? exit.blocked() : exit.blocked;
  if (exit.when && !exit.when()) { print(blocked || "You can't go that way."); return true; }
  if (!exit.to) { print(blocked || "You can't go that way."); return true; }
  farewell(exit);
  arrive(exit.to, typeof exit.text === "function" ? exit.text() : exit.text, exit.onArrive);
  return true;
}

function farewell(exit) {
  if (exit.noFarewell) return;
  const here = npcsHere().filter(n => PARTING[n.key]);
  const unsaid = here.filter(n => !state.parted[n.key]);
  if (!unsaid.length) return;
  if (here.length === 1) {
    const p = PARTING[here[0].key];
    print(typeof p === "function" ? p() : p);
  } else {
    print("You nod to the others and take your leave.");
  }
}

function examine(name) {
  const found = findTarget(name);
  if (!found) {
    const exit = findExit(name);
    if (exit && !(exit.when && !exit.when())) return print(exit.peek || `That way leads on. (Try “go ${name}”.)`);
    return print("You don't see that here.");
  }
  if (found.type === "ambiguous" || found.type === "suggestions") return clarify(found);
  const text = describe(found.entry);
  print(text);
  reveal(found.entry.reveals);
  recordNote(found, text);
}

function recordNote(found, text) {
  if (found.type === "item") return;
  const id = state.scene;
  state.notes[id] = state.notes[id] || {};
  const title = found.entry.title || (found.type === "npc" ? found.entry.name.replace(/^(the|a)\s+/, "") : found.key);
  state.notes[id][found.key] = { title, text, key: found.type === "npc" || keyOf("object", found.entry) };
  renderNotes();
}

function renderNotes() {
  const panel = document.getElementById("notes");
  if (!panel) return;
  const open = new Set([...panel.querySelectorAll("details[open]")].map(d => d.dataset.id));
  const order = [state.scene, ...state.visitedScenes.filter(id => id !== state.scene).reverse()];
  let html = "";
  for (const id of order) {
    const entries = Object.entries(state.notes[id] || {});
    const current = id === state.scene;
    if (!entries.length && !current) continue;
    html += `<h2${current ? ' class="current"' : ""}>${esc(scenes[id].name)}</h2>`;
    if (!entries.length) html += '<div class="empty">Nothing yet.</div>';
    entries.sort((a, b) => (b[1].key ? 1 : 0) - (a[1].key ? 1 : 0));
    for (const [key, note] of entries) {
      const did = id + ":" + key;
      html += `<details data-id="${did}"${open.has(did) ? " open" : ""}><summary>${esc(note.title)}${note.key ? '<span class="badge" title="Key item">★</span>' : ""}</summary><p>${fmt(note.text, id)}</p></details>`;
    }
  }
  panel.innerHTML = html;
}

const VERB_CANON = {
  sign: "sign", write: "sign", "write in": "sign", "write on": "sign", autograph: "sign",
  read: "read", sit: "sit", "sit on": "sit", "sit at": "sit", "sit in": "sit", "sit down": "sit",
  touch: "touch", peel: "touch", lift: "touch", feel: "touch", pat: "touch", rub: "touch", stroke: "touch",
  push: "push", pull: "push", shove: "push", turn: "push", move: "push", knock: "push", "knock on": "push", kick: "push",
  smell: "smell", sniff: "smell", taste: "taste", lick: "taste",
  open: "open", close: "close", shut: "close",
  climb: "climb", "climb on": "climb",
  search: "search", rummage: "search", "look through": "search", "dig through": "search",
  drink: "drink", sip: "drink", ring: "push", lean: "touch", "lean on": "touch",
  use: "use", take: "take", get: "take", grab: "take",
  board: "board", ride: "board", shout: "call", call: "call", yell: "call", answer: "call", reply: "call", respond: "call", "call out": "call", "shout back": "call"
};

const VERB_DEFAULT = {
  board: "There's nothing here to board.",
  call: "Your voice goes flat in the damp air. Nothing answers.",
  sign: "There's nothing here to sign.",
  read: "There's nothing to read on it.",
  sit: "You'd rather not sit on that.",
  touch: "You touch it. Nothing in particular happens.",
  push: "It doesn't budge, and you feel a bit silly.",
  smell: "It smells like what it is.",
  taste: "You think better of it.",
  open: "It doesn't open, or there's nothing in it that you'd find.",
  close: "It isn't open.",
  climb: "You can't climb that.",
  search: "You look it over carefully but find nothing more.",
  drink: "That isn't something you can drink.",
  use: "You're not sure how to use that here.",
  take: "That isn't yours to take."
};

function act(verb, name) {
  const found = findTarget(name);
  if (!found) return print("You don't see that here.");
  if (found.type === "ambiguous" || found.type === "suggestions") return clarify(found);
  const e = found.entry;
  if (verb === "use" && found.key === "phone") return print(phoneText());
  const custom = e.verbs && e.verbs[verb];
  if (custom) {
    const result = typeof custom === "function" ? custom() : custom;
    if (result) print(result);
    return;
  }
  if (verb === "take" && e.take) return print(e.take());
  if (verb === "take" && found.type === "item") return print("It's already with you.");
  if (verb === "read" || verb === "search") return examine(name);
  if (verb === "open" && e.open) return print(e.open());
  print(VERB_DEFAULT[verb]);
}

const SPEAKER = { volunteer: "Margaret", ogee: "Ogee", dixon: "Dixon", clerk: "The surveyor", settler: "Eli" };

const SOCIAL = {
  volunteer: {
    hello: "“Hello, hello.” She smiles over her glasses.",
    thanks: "“Oh, you're very welcome. Nobody thanks the volunteers. Not often.”",
    bye: "“Mind the fog on your way. It comes up quick this time of year.”",
    how: "“Can't complain. Quiet Saturday, a crossword, and someone to talk to. That's a good day.”",
    sorry: "“Don't mention it.”"
  },
  ogee: {
    hello: "“You came through the fog, eh? I'm Joseph Ogee. I run this ferry.”",
    thanks: "Ogee grunts. “Don't thank me yet. River's not done with any of us.”",
    bye: "“Watch the water.”",
    how: "“Alive. Dock's still standing. That's a good week.”",
    sorry: "“No harm done.”"
  },
  dixon: {
    hello: "Dixon inclines his head. “Good day to you.”",
    thanks: "“You're welcome. A man ought to be civil on a river.”",
    bye: "“Safe passage.”",
    how: "“Well enough. Trade is slow, but it's early yet.”",
    sorry: "“No offence taken.”"
  },
  clerk: {
    hello: "The surveyor glances up from his field book. “Yes?”",
    thanks: "“Pay me, and we're square.” He sounds as though thanks are not entirely a pleasure.",
    bye: "“Do come again when you have the money.”",
    how: "“Busy. The Galena road doesn't survey itself.”",
    sorry: "“Quite.”"
  },
  settler: {
    hello: "Eli gives a quick, nervous nod. “Evening.”",
    thanks: "“Oh. Sure. Anytime.” He looks pleased and a little surprised.",
    bye: "“See you around. Watch the river.”",
    how: "“Jumpy, mostly. Folks say the war's coming back.”",
    sorry: "“It's all right.”"
  }
};

function speak(key, text) {
  const who = key === "ogee" && !state.ogeeIntroduced ? "The ferryman" : SPEAKER[key];
  if (key === "ogee" && !state.ogeeIntroduced) text = text.replace(/^Ogee says,/, "The ferryman says,");
  if (who && text.startsWith("“")) text = `${who} says, ${text}`;
  print(text);
}

function talk(name) {
  const found = findTarget(name);
  if (!found || found.type === "suggestions" || found.type === "ambiguous") {
    if (found) return clarify(found);
    return print("There is no one by that name here.");
  }
  if (found.type !== "npc") {
    if (found.entry.onTalk) return found.entry.onTalk();
    return print("It doesn't answer.");
  }
  const npc = found.entry;
  if (npc.talk) return speak(found.key, npc.talk());
  if (found.key === "ogee" && state.ogeeIntroduced) {
    return speak(found.key, "He gives you a nod. “Back again. Anything else you wanted to know?”");
  }
  speak(found.key, npcTalk[found.key] || `${npc.name} looks at you but says nothing yet.`);
  if (found.key === "ogee") state.ogeeIntroduced = true;
}

function social(kind, name) {
  let target = null;
  if (name) {
    const found = findTarget(name);
    if (found && (found.type === "ambiguous" || found.type === "suggestions")) return clarify(found);
    if (found && found.type === "npc") target = found;
  }
  if (!target) {
    const here = npcsHere();
    if (here.length === 1) target = here[0];
    else if (!here.length) return print("There's no one here to say that to.");
    else return print(`Say that to whom? ${here.map(n => (SPEAKER[n.key] || n.key).toLowerCase()).join(" or ")}?`);
  }
  const lines = SOCIAL[target.key];
  if (kind === "hello" && target.key === "volunteer" && state.returned && !state.greeted) {
    state.greeted = true;
    return speak(target.key, "“Oh, hello again.” She glances at the panel and back. “Were you down by the river?”");
  }
  if (kind === "hello" && target.key === "ogee" && !state.ogeeIntroduced) state.ogeeIntroduced = true;
  if (kind === "bye") state.parted[target.key] = true;
  speak(target.key, (lines && lines[kind]) || `${target.entry.name} acknowledges you with a nod.`);
}

function pleasantry(input) {
  let m;
  const person = "(?:\\s+(?:to\\s+)?(.+))?";
  if ((m = input.match(new RegExp("^(?:say\\s+)?(?:thanks|thank you|thank-you|thx|ty|cheers)(?:\\s+(?:so much|very much|a lot))?" + person + "$"))) ||
      (m = input.match(/^thank\s+(?:you\s+)?(.+)$/))) return social("thanks", m[1]);
  if ((m = input.match(new RegExp("^(?:say\\s+)?(?:hello|hi|hey|howdy|greetings|good (?:morning|afternoon|evening|day)|evening|afternoon)" + person + "$")))) return social("hello", m[1]);
  if ((m = input.match(new RegExp("^(?:say\\s+)?(?:goodbye|good-bye|bye|farewell|see you|see you later|take care|good night|cheerio)" + person + "$")))) return social("bye", m[1]);
  if ((m = input.match(/^(?:how are you|how's it going|how are things|how do you do|what's up|how have you been)(?:\s+(.+))?$/))) return social("how", m[1]);
  if ((m = input.match(new RegExp("^(?:say\\s+)?(?:sorry|excuse me|pardon me|apologi[sz]e)" + person + "$")))) return social("sorry", m[1]);
  if ((m = input.match(/^(?:have a (?:good|nice|great) (?:day|evening|night|one)|good luck|best wishes|well wishes)(?:\s+(.+))?$/))) return social("bye", m[1]);
  return false;
}

function npcsHere() {
  return candidates().filter(c => c.type === "npc");
}

function ask(rest) {
  const m = rest.match(/^(.+?)\s+(?:about|for|if)\s+(.+)$/);
  let npcName = m ? m[1] : null;
  let topic = m ? m[2] : rest.replace(/^(?:about|for)\s+/, "");
  let target = null;
  if (npcName) {
    const found = findTarget(npcName);
    if (found && (found.type === "ambiguous" || found.type === "suggestions")) return clarify(found);
    target = found;
  } else {
    const sole = npcsHere();
    if (sole.length === 1) target = sole[0];
    else if (!sole.length) return print("There's no one here to ask.");
    else {
      const guess = findTarget(rest);
      if (guess && guess.type === "npc") return talk(rest);
      return print(`Ask whom? ${sole.map(n => (SPEAKER[n.key] || n.key).toLowerCase()).join(" or ")}?`);
    }
  }
  if (!target || target.type !== "npc") {
    const sole = npcsHere();
    if (sole.length === 1 && !npcName) target = sole[0];
    else return print("There's no one by that name here.");
  }
  const npc = target.entry;
  topic = cleanName(topic);
  const hit = (npc.topics || []).find(t => t.keys.some(k => topic.includes(k)));
  if (!hit) return speak(target.key, npc.fallback || `${npc.name} has nothing to say about that.`);
  speak(target.key, typeof hit.say === "function" ? hit.say() : hit.say);
  reveal(hit.reveals);
}

function run(input) {
  let m;
  if (state.returned && !state.fog && !state.shift && (state.scene === "riverbank" || state.scene === "riverpath")
      && /^(?:(?:go|walk|head|return|run|get|come)\s+)?(?:(?:back\s+)?to\s+)?(?:the\s+)?(?:museum|historic center|center|margaret)$/.test(input)) {
    return arrive("museum", "You make your way back to the Historic Center, the river walk and Hennepin passing in a blur of ordinary evening. Margaret glances up from her desk.");
  }
  if (state.scene === "riverbank" && /^(?:swim|wade|jump in(?:to)?|dive in(?:to)?|go in(?:to)?|walk into|step into)(?:\s+(?:the\s+)?(?:water|river))?$/.test(input)) return run("go water");
  if (/^(?:help|hint|hints|\?|what (?:now|next|do i do|should i do)|what can i do|i'm stuck|stuck)$/.test(input)) return hint();
  if (/^(look|l)( around)?$/.test(input)) return look();
  if ((m = input.match(/^(?:pick up|take|get|grab)\s+(.+)$/))) return act("take", m[1]);
  if ((m = input.match(/^(?:look at|examine|x|inspect|check|study|look in|look under|look behind)\s+(.+)$/))) return examine(m[1]);
  if ((m = input.match(/^look\s+(.+)$/))) {
    const exit = findExit(m[1]);
    if (exit) return print(exit.peek || `You look ${m[1]}, but see nothing you hadn't already seen.`);
    return examine(m[1]);
  }
  if ((m = input.match(/^(?:talk to|talk with|speak to|speak with|tell|chat with)\s+(.+?)\s+about\s+(.+)$/))) return ask(`${m[1]} about ${m[2]}`);
  if ((m = input.match(/^(?:talk to|talk with|speak to|speak with|greet|chat with)\s+(.+)$/))) return talk(m[1]);
  if (state.fog && PAST.includes(state.scene) && /^(?:follow|take (?:his |ogee's )?arm|go with ogee|stay|stay close|trust ogee|walk with ogee|let ogee lead)(?:.*)?$/.test(input)) return followOgee();
  if (/^(?:yes|yeah|sure|ok|okay|aye)$/.test(input)) {
    if (state.scene === "riverbank" && state.shift >= 2) return act("call", "voice");
    if (state.scene === "ferry" || state.scene === "farbank") return run("haul");
  }
  if (/^(?:shout|call|yell|answer)(?: out| back)?$/.test(input)) {
    return state.scene === "riverbank" && state.shift >= 2 ? act("call", "voice") : print(VERB_DEFAULT.call);
  }
  if ((m = input.match(/^ask\s+(.+)$/))) return ask(m[1]);
  if ((m = input.match(/^(?:go|walk|head|enter|move|descend|ascend|climb down|climb up|run|step)(?: to| toward| towards| into| through)?\s+(?:the\s+)?(.+)$/))) {
    const exit = findExit(m[1]);
    return exit ? move(exit) : print("You can't go that way.");
  }
  const dirWord = DIRS[input] || input;
  if (["north", "south", "east", "west", "up", "down"].includes(dirWord)) {
    const dirExit = findExit(dirWord);
    return dirExit ? move(dirExit) : print("You can't go that way.");
  }
  const bare = findExit(input);
  if (bare) return move(bare);
  const verbs = Object.keys(VERB_CANON).sort((a, b) => b.length - a.length);
  for (const v of verbs) {
    if (input.startsWith(v + " ")) return act(VERB_CANON[v], input.slice(v.length + 1));
  }
  if (/^(wait|z|rest)$/.test(input)) return print("You wait. Time passes, slowly.");
  if (pleasantry(input) !== false) return;
  if (/^listen$/.test(input)) { const l = scene().listen; return print((typeof l === "function" ? l() : l) || "You listen. Nothing stands out."); }
  if (/^(i|inv|inventory)$/.test(input)) {
    const carried = ["your phone"];
    if (state.hasAxe) carried.push("an axe");
    print(`You are carrying ${carried.join(" and ")}.` + (PAST.includes(state.scene) ? ` There is $${state.money} in your pocket.` : ""));
    return;
  }
  if (/^(think|goals|recall)$/.test(input)) {
    if (!state.visited1830) return print("You think about the empty pedestal, and the line of the panel that ends too soon.");
    const bits = PAST.includes(state.scene) ? [`You have $${state.money}.`] : [];
    if (state.hasLand) bits.push("The ridge claim is yours.");
    if (state.dixonOwns) bits.push("Dixon has his ferry.");
    else if (state.hasFerry) bits.push("The ferry is yours, which does not feel right.");
    else bits.push(`Dixon is $${FERRY_PRICE - state.dixonCash} short of the ferry.`);
    if (state.dixonOwns) bits.push("It feels, for a moment, like the first chapter is finished.");
    return print(bits.join(" "));
  }
  if ((m = input.match(/^(?:haul|load (?:the )?(?:kegs?|wagons?)|carry (?:the )?kegs?|deliver|work|take (?:the|a) (?:job|trip)|do (?:the|a) (?:job|trip)|earn money|make money)(?:\s+(?:kegs?\s+)?(\d+|week))?$/))) {
    if (state.scene !== "ferry" && state.scene !== "farbank") return print("There's nothing here to haul.");
    const trips = m[1] === "week" ? 3 : Math.min(Math.max(parseInt(m[1] || "1", 10), 1), 6);
    if (state.fog) return print("The fog is too thick to pole across. Ogee's hand stays on your sleeve.");
    const boss = state.scene === "ferry" && !state.dixonOwns ? "Ogee" : "Dixon";
    const lines = [
      `You load the kegs and pole across. ${boss} counts them off and marks the tally.`,
      `Four kegs, a calm river, and a team of oxen that does not want to board. ${boss} marks the tally.`,
      `The current is running high today. You pole hard, and ${boss} marks the tally without a word.`
    ];
    state.hauls = (state.hauls || 0) + trips;
    state.money += 20 * trips;
    print(trips === 1 ? lines[state.hauls % lines.length] + " Twenty dollars for the trip." : `You work ${trips} trips, kegs across and empty boat back. Twenty dollars a trip: $${20 * trips}.`);
    print(`You now have $${state.money}.`);
    return;
  }
  if (/^(chop|cut wood|timber|cut timber)/.test(input)) {
    if (state.hasAxe && (state.scene === "cabins" || state.scene === "ferry")) {
      state.money += 15;
      print("You spend the day cutting white oak. The sawmill downriver will take it. Fifteen dollars for the load.");
      print(`You now have $${state.money}.`);
    } else if (!state.hasAxe) print("You haven't got anything to cut it with.");
    else print("There's no timber to cut here.");
    return;
  }
  if (/^(buy|purchase) (land|plot)/.test(input)) {
    if (state.scene !== "farbank") return print("Claims are written up across the river, by the surveyor at Dixon's trading post.");
    if (state.hasLand) return print("You already own the ridge plot.");
    if (state.money < 42) return print("You don't have enough money. The ridge claim is forty dollars plus a two-dollar fee for entering the bounds.");
    state.money -= 42;
    state.hasLand = true;
    print("You count out forty-two dollars. The surveyor enters the bounds in his field book and signs a receipt. The ridge-line timber claim is yours.");
    print(`You now have $${state.money}.`);
    chapterEnd();
    return;
  }
  if (/^(buy|purchase) (ferry|boat)/.test(input)) {
    if (state.scene !== "ferry") return print("Ogee isn't here.");
    if (state.dixonOwns) return print("The ferry isn't for sale. It's Dixon's now.");
    if (state.hasFerry) return print("You already own the ferry.");
    if (state.money < FERRY_PRICE) return print(`You don't have enough money. Ogee wants $${FERRY_PRICE}. (Dixon is the one who wants this ferry; you could help him with it.)`);
    state.money -= FERRY_PRICE;
    state.hasFerry = true;
    print(`You count out $${FERRY_PRICE}. Ogee hands you the rope and the pole. The ferry is yours. Across the river, Dixon watches from his dock, then turns and walks slowly back toward the post.`);
    print(`You now have $${state.money}.`);
    chapterEnd();
    return;
  }
  if (/^(?:give|lend|pay|hand)(?:\s+(?:dixon|john|him))?$/.test(input)) return print("Give how much? (give Dixon 50)");
  if ((m = input.match(/^(?:give|lend|pay|hand)\s+(?:(?:dixon|john|him)\s+)?\$?(\d+|all|the rest|the difference)(?:\s*(?:dollars?|bucks))?(?:\s+to\s+(?:dixon|john|him))?$/))) {
    if (state.scene !== "farbank") return print("Dixon isn't here.");
    if (state.dixonOwns) return print("Dixon has what he needs.");
    const need = FERRY_PRICE - state.dixonCash;
    if (state.money <= 0) return print("You have no money to give.");
    let amount = /^\d+$/.test(m[1]) ? parseInt(m[1], 10) : Math.min(state.money, need);
    if (amount <= 0) return print("Give how much?");
    if (amount > state.money) return print(`You only have $${state.money}.`);
    amount = Math.min(amount, need);
    if (amount >= need && !state.hasLand && !state.warnedClaim) {
      state.warnedClaim = true;
      return print("Dixon holds up a hand before you can pass it over. “Wait. Once this is done, I don't expect you'll be staying. If you want anything of your own, the surveyor is still writing up claims.” Say it again when you're ready.");
    }
    state.money -= amount;
    state.dixonCash += amount;
    if (state.dixonCash < FERRY_PRICE) {
      print(`Dixon takes the money slowly. “That's $${state.dixonCash} I have now. $${FERRY_PRICE - state.dixonCash} to go.”`);
      print(`You now have $${state.money}.`);
      return;
    }
    state.dixonOwns = true;
    print("Dixon counts the money into a leather pouch and looks at you for a long moment. “I'll make this right, whatever the river allows.” He walks you down to the dock. Across the water, he and Ogee settle it in the old way: a handshake, a pouch, and a rope and a pole changing hands. Ogee looks across the river at you and lifts his chin. Then Dixon's hand closes on the pole.");
    print(`You now have $${state.money}.`);
    chapterEnd();
    return;
  }
  if (/^price/.test(input)) {
    return print(state.scene === "ferry" ? (state.dixonOwns ? "The ferry is Dixon's now." : state.hasFerry ? "The ferry is yours; there's nothing left to buy." : `Ogee says, “A fellow came up from downriver and offered me three hundred sixty dollars for her. Dixon's been over twice, but he hasn't got that much. I'd rather sell to someone around here, but I can't turn down the full price.”`) : "Nothing here is for sale.");
  }
  print(`You can't think how to do that. (${VERBS})`);
}

function handle() {
  const raw = cmd.value.trim().slice(0, 40);
  cmd.value = "";
  if (!raw) return;
  print("> " + raw, "echo");
  const before = state.scene;
  run(raw.toLowerCase().replace(/[.!?]+$/, ""));
  if (state.scene === before) {
    state.turnsHere++;
    if (scene().onTick) scene().onTick();
  }
}

cmd.maxLength = 40;
cmd.addEventListener("keydown", e => { if (e.key === "Enter") handle(); });
const wire = (id, fn) => { const el = document.getElementById(id); if (el && el.addEventListener) el.addEventListener("change", fn); };
wire("opt-sidebar", e => { settings.sidebar = e.target.checked; applySettings(); });
wire("opt-hl", e => { settings.highlight = e.target.value; applySettings(); });
wire("opt-clicks", e => { settings.clicks = e.target.checked; applySettings(); });
const gear = document.getElementById("gear");
if (gear && gear.addEventListener) gear.addEventListener("click", () => {
  const panel = document.getElementById("settings");
  const open = panel.classList.toggle("open");
  gear.setAttribute("aria-expanded", open);
});
output.addEventListener && output.addEventListener("click", e => {
  const noun = e.target.dataset && e.target.dataset.noun;
  if (settings.clicks && noun) { cmd.value = (findExit(noun) && !findTarget(noun) ? "go " : "examine ") + noun; handle(); cmd.focus(); }
});
applySettings();
const quick = document.getElementById("quick");
if (quick && quick.addEventListener) quick.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest("button");
  if (!b) return;
  if (b.dataset.run) { cmd.value = b.dataset.run; handle(); }
  else { cmd.value = b.dataset.fill; cmd.focus(); }
});
const enterButton = document.getElementById("enter");
if (enterButton) enterButton.addEventListener("click", handle);

const start = typeof location !== "undefined" && /scene=(\w+)/.exec(location.search);
if (start && scenes[start[1]]) state.scene = start[1];
state.visitedScenes.push(state.scene);
print(scene().name, "heading");
look();
renderNotes();
</script>
