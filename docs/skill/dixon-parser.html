<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dixon Parser</title>
<style>
body { font-family: monospace; background: #1a1a1a; color: #e0e0e0; margin: 2rem; }
#output { white-space: pre-wrap; min-height: 20rem; border: 1px solid #444; padding: 1rem; margin-bottom: 1rem; }
.interactive { color: #7ec8e3; }
input { width: 70%; background: #222; color: #e0e0e0; border: 1px solid #444; padding: 0.5rem; }
button, select { padding: 0.5rem 1rem; margin-left: 0.5rem; }
</style>
</head>
<body>
<h1>Dixon Parser</h1>
<div>
  Scene: <select id="sceneSelect" onchange="switchScene()">
  <option value="museum">Present-day Museum (gauge)</option>
    <option value="ferry">1830 Ogee Ferry (east bank)</option>
    <option value="farbank">1830 Far Bank (Dixon)</option>
    <option value="cabins">1830 Ogee's Cabins</option>
    <option value="lighthouse">1840 Lighthouse Cottage</option>
  </select>
</div>
<div id="output"></div>
<input id="cmd" maxlength="40" placeholder="type a command (look around, examine ferry, talk to ogee, go north, haul, buy land...)" autofocus>
<button onclick="handle()">Enter</button>
<script>
const output = document.getElementById('output');
const cmd = document.getElementById('cmd');
const sceneSelect = document.getElementById('sceneSelect');

const scenes = {
  museum: {
    location: "the Lee County Historical Society museum, present day",
    sensory: ["fluorescent lights hum over glass cases and framed photos", "the air smells of old paper and floor wax", "one pedestal stands empty with a faded outline", "a window shows a glimpse of the river"],
    objects: {
      exhibit: { desc: "The founding exhibit panel. It currently reads in generic terms about John Dixon and the early ferry.", aliases: ["panel", "founding", "display"] },
      pedestal: { desc: "An empty pedestal. A small card says 'Exhibit temporarily removed for conservation.'", aliases: ["empty", "stand"] }
    },
    npcs: {},
    exits: { outside: "the street and the path toward the riverbank" },
    goals: "Note the generic exhibit and empty pedestal. Leave toward the river."
  },
  ferry: {
    location: "the ferry landing on the east bank of the Rock River, 1830",
    sensory: ["the water moves slow and brown beneath a wooden dock. The flatboat looks ready to cross", "a man in a buckskin shirt is nearby if you want to talk", "a dirt path climbs north toward cabins where you might find tools"],
    objects: {
      ferry: { desc: "Joseph Ogee's flatboat, rope and pole, sound and ready. He runs it across the Rock River.", aliases: ["boat", "flatboat"] },
      dock: { desc: "A rough wooden dock of planks and posts, half-submerged at the edges.", aliases: ["landing", "wharf"] },
      canoe: { desc: "An old dugout canoe, cracked along the seam and half-buried in gravel south of the dock. No paddle.", aliases: ["dugout"] }
    },
    npcs: {
      ogee: { name: "Joseph Ogee", desc: "A man in a buckskin shirt splitting firewood near the cabins. He runs the ferry and has been here longer than the town.", aliases: ["ogee", "joseph"] }
    },
    exits: { north: "the path up to Ogee's cabins and the settlement", south: "the gravel shelf and forest", east: "the river bend and limestone bluffs", west: "the far bank across the river", fog: "the fog leading back to the present-day museum" },
    goals: "Arrive broke. Learn the ferry or timber options. Meet Ogee and Dixon."
  },
  farbank: {
    location: "the far bank of the Rock River, near Dixon's trading post, 1830",
    sensory: ["the flatboat rocks against the opposite dock. A tall man in a dark coat watches from the path", "barrels and pelts are visible through the open door of a rough post building. Someone inside handles land papers", "a nervous young man with a rifle sits near the door"],
    objects: {
      post: { desc: "Dixon's trading post — a single-room building of logs and plank, shelves of goods and a ledger on the counter.", aliases: ["trading post", "store", "post"] },
      dock: { desc: "The west-bank dock, smaller than Ogee's, with a hitching post nearby.", aliases: ["landing"] }
    },
    npcs: {
      dixon: { name: "John Dixon", desc: "A tall man in a dark coat. Quiet trader who does fair business with the Sauk and Fox. He set up here a few years back.", aliases: ["dixon", "john"] },
      clerk: { name: "the land office clerk", desc: "A thin man behind a counter inside a side room of the post, a large map on the wall and a ledger open. He handles government land sales at a dollar twenty-five an acre.", aliases: ["clerk", "land clerk", "office"] },
      settler: { name: "a young settler", desc: "A nervous young man in patched homespun, leaning near the door with an old percussion rifle across his knees. He glances at the river often.", aliases: ["settler", "boy", "young man", "eli"] }
    },
    exits: { east: "back across the river to Ogee's ferry landing", north: "the path toward the settlement and land office" },
    goals: "Meet John Dixon. Deliver goods or learn about the land."
  },
  cabins: {
    location: "Ogee's cabins in the clearing north of the ferry, 1830",
    sensory: ["smoke rises from the middle cabin. An axe leans against a chopping block — useful for timber work", "the path back to the river is visible to the south"],
    objects: {
      cabin: { desc: "The middle cabin. A loft with a straw mattress and a chest. Blankets inside.", aliases: ["middle cabin", "loft"] },
      axe: { desc: "A worn axe leaning against the wall. Good for splitting or timber work.", aliases: ["hatchet"] }
    },
    npcs: {
      ogee: { name: "Joseph Ogee", desc: "Ogee is here when he's not at the dock. He can point you toward timber work.", aliases: ["ogee", "joseph"] }
    },
    exits: { south: "back down the path to the ferry landing" },
    goals: "Rest, take the axe, or ask about timber work."
  },
  lighthouse: {
    location: "lighthouse keeper's cottage, rocky Maine coast, 1840",
    sensory: ["salt-crusted window glass", "the lantern's wick hissing in its housing", "a smell of lamp oil and wet wool"],
    objects: {
      lantern: { desc: "A storm lantern sits on its shelf, wick hissing.", aliases: ["lamp", "flame", "light"] },
      logbook: { desc: "The keeper's logbook lies open on the desk. The last entry ends mid-sentence: \"the light went out at midnight and I heard—\"", aliases: ["journal", "diary", "book"] },
      telescope: { desc: "A brass telescope stands by the door.", aliases: ["spyglass", "glass"] }
    },
    npcs: {},
    exits: { west: "the rocky path down to the dock", north: "the spiral stair up to the lantern room" },
    goals: "Explore the cottage. Examine the logbook."
  }
};

let currentScene = "museum";
let inventory = [];
let money = 0;
let hasLand = false;
let hasFerry = false;
let hasAxe = false;
let visited1830 = false;

function print(text) {
  output.innerHTML += text.replace(/\n/g, "<br>") + "<br><br>";
  output.scrollTop = output.scrollHeight;
}

function getScene() { return scenes[currentScene]; }

function editDistance(a, b) {
  const row = Array.from({ length: b.length + 1 }, (_, index) => index);
  for (let i = 1; i <= a.length; i++) {
    let diagonal = row[0];
    row[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const above = row[j];
      row[j] = Math.min(row[j] + 1, row[j - 1] + 1, diagonal + (a[i - 1] === b[j - 1] ? 0 : 1));
      diagonal = above;
    }
  }
  return row[b.length];
}

function findObject(name) {
  name = name.toLowerCase().trim().replace(/^(the|a|an)\s+/, "");
  const matches = [];
  const s = getScene();
  for (const [key, obj] of Object.entries(s.objects)) {
    const labels = [key, ...(obj.aliases || [])];
    matches.push({ type: "object", key, labels });
  }
  for (const [key, npc] of Object.entries(s.npcs || {})) {
    const labels = [key, npc.name.toLowerCase(), ...(npc.aliases || [])];
    matches.push({ type: "npc", key, labels });
  }
  const exact = matches.filter(match => match.labels.includes(name));
  if (exact.length === 1) return exact[0];
  if (exact.length > 1) return { type: "ambiguous", candidates: exact.slice(0, 2) };

  const scored = matches.map(match => ({
    ...match,
    distance: Math.min(...match.labels.map(label => editDistance(name, label)))
  })).sort((a, b) => a.distance - b.distance);
  const threshold = name.length >= 4 ? 1 : 0;
  if (scored.length && scored[0].distance <= threshold) {
    const best = scored.filter(match => match.distance === scored[0].distance);
    if (best.length === 1) return best[0];
    return { type: "ambiguous", candidates: best.slice(0, 2) };
  }
  if (name.length >= 4 && scored.length && scored[0].distance <= 2) {
    return { type: "suggestions", candidates: scored.slice(0, 2) };
  }
  return null;
}

function describeMatchResult(found) {
  if (found.type === "ambiguous") {
    print(`Which do you mean: ${found.candidates.map(candidate => candidate.key).join(" or ")}?`);
  } else {
    print(`I don't see that exact name. Did you mean ${found.candidates.map(candidate => candidate.key).join(" or ")}?`);
  }
}

function switchScene() {
  currentScene = sceneSelect.value;
  output.textContent = "";
  print(`Switched to ${getScene().location}. Type 'look around' to begin.`);
}

function handle() {
  let input = cmd.value.trim().slice(0, 40).toLowerCase();
  cmd.value = "";
  if (!input) return;
  input = input.replace(/^(get|grab|pick up)\s+/, "take ").replace(/^(check|inspect|study)\s+/, "examine ");
  print("> " + input);

  const s = getScene();

  if (input.startsWith("look around") || input === "look") {
    if (currentScene === "museum") {
      let exhibitText = "The founding exhibit panel reads: “John Dixon established a ferry and trading post on the Rock River in the early 1830s. The settlement that grew around it took his name.”";
      if (visited1830) {
        if (hasLand && hasFerry) exhibitText = "The founding exhibit now includes a land-patent card and a note that the ferry passed to a newcomer in 1830. A small object sits on the previously empty pedestal.";
        else if (hasLand) exhibitText = "The founding exhibit now includes a land-patent card for the ridge plot. The pedestal remains empty.";
        else if (hasFerry) exhibitText = "The founding exhibit notes that the ferry changed hands in 1830. The pedestal remains empty.";
        else exhibitText = "The founding exhibit remains generic. The pedestal is still empty.";
      }
      print(`You are at ${s.location}. ${s.sensory.join(". ")}.`);
      print(exhibitText);
      print("You see: <span class=\"interactive\">exhibit</span>, <span class=\"interactive\">pedestal</span>.");
      print("Exits: <span class=\"interactive\">outside</span>.");
    } else {
      print(`You are at ${s.location}. ${s.sensory.join(". ")}.`);
      const interactives = [];
      for (const key of Object.keys(s.objects)) interactives.push(`<span class=\"interactive\">${key}</span>`);
      for (const key of Object.keys(s.npcs || {})) interactives.push(`<span class=\"interactive\">${key}</span>`);
      if (interactives.length) print("You see: " + interactives.join(", ") + ".");
      const exitList = Object.keys(s.exits).map(d => `<span class=\"interactive\">${d}</span>`).join(", ");
      print("Exits: " + exitList + ".");
    }
  } else if (input.startsWith("look ") && !input.startsWith("look at ")) {
    const direction = input.slice(5);
    if (s.exits[direction]) print(`You look ${direction} toward ${s.exits[direction]}.`);
    else print("You don't see anything notable in that direction.");
  } else if (input.startsWith("examine ") || input.startsWith("look at ")) {
    const target = input.replace(/^(examine |look at )/, "");
    const found = findObject(target);
    if (found && found.type !== "object" && found.type !== "npc") describeMatchResult(found);
    else if (found && found.type === "object") print(s.objects[found.key].desc);
    else if (found && found.type === "npc") print(s.npcs[found.key].desc);
    else print("You don't see that here.");
  } else if (input.startsWith("talk to ")) {
    const target = input.slice(8);
    const found = findObject(target);
    if (found && found.type !== "object" && found.type !== "npc") describeMatchResult(found);
    else if (found && found.type === "npc") {
      if (found.key === "ogee") print('Ogee sets down the axe. "Name\'s Ogee. Joseph Ogee. This is my place. You looking to settle, or just passing through?"');
      else if (found.key === "dixon") print('Dixon steps forward as you tie off. "John Dixon." His handshake is firm. "Ogee send you?"');
      else if (found.key === "clerk") print('The clerk looks up from the ledger. "Forty acres near the river go fast. Dollar twenty-five an acre from the government. Ridge line west is thicker timber if you take it as-is."');
      else if (found.key === "settler") print('The young man shifts the rifle. "Dixon told me to watch for boats. Didn\'t say nothing about people. Name\'s Eli."');
      else print(`${s.npcs[found.key].name} looks at you but says nothing yet.`);
    } else print("There is no one by that name here.");
  } else if (input.startsWith("ask ")) {
    if (input.includes("price") || input.includes("ferry") || input.includes("buy")) {
      if (currentScene === "ferry") print('Ogee says, "Three hundred dollars. Boat\'s sound. Rope\'s new last spring. Work it off if you want — whiskey kegs to the settlement, twenty dollars a trip."');
      else print("Ask someone else about that.");
    } else if (input.includes("land") || input.includes("plot") || input.includes("timber") || input.includes("acre")) {
      print('The clerk (or Dixon) nods. "Plots near the ferry road go first. Ridge line west is thicker timber, sixty acres for forty dollars if you take it as-is. Land office fee is two more."');
    } else if (input.includes("sauk") || input.includes("treaty") || input.includes("militia") || input.includes("black hawk") || input.includes("eli")) {
      print('Dixon (or Eli) is quiet a moment. "Eighteen thirty-two. Black Hawk tried to come back east. Militia built Fort Dixon right here. Lincoln was a captain. Taylor had the regulars. Davis was a lieutenant. Never saw a battle. Just the aftermath." Eli adds that his pa died at Stillman\'s Run.');
    } else if (input.includes("work") || input.includes("haul") || input.includes("keg") || input.includes("freight")) {
      print('Ogee says, "Whiskey kegs to the settlement. Four kegs, about a hundred fifty pounds each. Twenty dollars a trip, three trips a week if the river\'s calm. Wagon and mules in the barn."');
    } else if (input.includes("dixon") && currentScene === "ferry") {
      print('Ogee says, "John Dixon. Trader. Set up across the river a few years back. Does a fair trade with the Sauk and Fox. Quiet man, but everybody knows him."');
    } else {
      print("They don't have much to say about that. Try asking about the ferry, land, work, or the militia.");
    }
  } else if (input.startsWith("go ")) {
    const dir = input.slice(3);
    if (currentScene === "museum" && (dir === "outside" || dir === "river" || dir === "to river")) {
      currentScene = "ferry";
      sceneSelect.value = "ferry";
      visited1830 = true;
      output.textContent = "";
      print("You step outside and follow the path to the river. Dense fog rolls in. Your phone dims. A grizzled voice cuts through: “You lookin’ for work?”");
      print("You are at the 1830 ferry landing. Type 'look around'.");
    } else if (currentScene === "ferry" && (dir === "fog" || dir === "back" || dir === "return")) {
      currentScene = "museum";
      sceneSelect.value = "museum";
      output.textContent = "";
      print("The fog thickens again. You step through and find yourself back on the present-day path. The museum is a short walk away.");
      print("You are at the museum. Type 'look around' to see what changed.");
    } else if (s.exits[dir]) {
      if (currentScene === "ferry" && dir === "west") {
        currentScene = "farbank";
        sceneSelect.value = "farbank";
        output.textContent = "";
        print("You pole across. The rope hums against the hull. Mid-river the current grabs, then eases. On the far bank a tall man in a dark coat watches you come in.");
        print(`You are at ${scenes.farbank.location}. Type 'look around' or 'talk to dixon'.`);
      } else if (currentScene === "farbank" && dir === "east") {
        currentScene = "ferry";
        sceneSelect.value = "ferry";
        output.textContent = "";
        print("You cross back. Ogee is on the dock coiling rope.");
        print(`You are at ${scenes.ferry.location}.`);
      } else if (currentScene === "ferry" && dir === "north") {
        currentScene = "cabins";
        sceneSelect.value = "cabins";
        output.textContent = "";
        print("You walk up the path. Three cabins sit in a clearing. Smoke comes from the middle one.");
        print(`You are at ${scenes.cabins.location}.`);
      } else if (currentScene === "cabins" && dir === "south") {
        currentScene = "ferry";
        sceneSelect.value = "ferry";
        output.textContent = "";
        print("You head back down the path to the dock.");
        print(`You are at ${scenes.ferry.location}.`);
      } else {
        print(`You go ${dir} toward ${s.exits[dir]}. (Further scene transitions not yet implemented.)`);
      }
    } else print("You can't go that way.");
  } else if (input === "goals") {
    print("Goals: " + s.goals);
    print(`Money: $${money}. ${hasLand ? "You own the ridge timber plot." : "No land yet."} ${hasFerry ? "You own the ferry." : ""} ${hasAxe ? "You have the axe." : ""}`);
    if (hasLand && hasFerry) print("You have both the land and the ferry. The first chapter is complete.");
  } else if (input === "inventory") {
    print(inventory.length ? inventory.join(", ") : "You are carrying nothing.");
    print(`Money: $${money}.`);
  } else if (input.includes("take axe") || input.includes("get axe") || input.includes("pick up axe")) {
    if (currentScene === "cabins" && !hasAxe) {
      hasAxe = true;
      inventory.push("axe");
      print("You take the axe. It's heavier than it looks.");
    } else if (hasAxe) print("You already have the axe.");
    else print("There's no axe here.");
  } else if (input.includes("haul") || input.includes("load keg") || input.includes("deliver")) {
    if (currentScene === "ferry" || currentScene === "farbank") {
      money += 20;
      print("You load the kegs and pole across. Dixon counts them and marks the ledger. Twenty dollars for the trip.");
      print(`You now have $${money}.`);
    } else print("Nothing to haul here.");
  } else if (input.includes("timber") || input.includes("cut wood") || input.includes("chop")) {
    if (hasAxe && (currentScene === "cabins" || currentScene === "ferry")) {
      money += 15;
      print("You spend the day cutting white oak. The sawmill downriver will take it. Fifteen dollars for the load.");
      print(`You now have $${money}.`);
    } else if (!hasAxe) print("You need an axe for timber work. Check the cabins.");
    else print("No timber work here.");
  } else if (input.includes("buy land") || input.includes("buy plot") || input.includes("purchase land")) {
    if (currentScene !== "farbank") {
      print("The land office is across the river, at Dixon's trading post.");
    } else if (money >= 42 && !hasLand) {
      money -= 42;
      hasLand = true;
      print("You count out forty-two dollars. The clerk stamps the paper. The ridge-line timber plot is yours. Get it surveyed before you build.");
      print(`You now have $${money}.`);
    } else if (hasLand) print("You already own the ridge plot.");
    else print("You don't have enough money. The ridge plot is forty dollars plus a two-dollar fee.");
  } else if (input.includes("buy ferry") || input.includes("purchase ferry")) {
    if (currentScene === "ferry") {
      if (money >= 300 && !hasFerry) {
        money -= 300;
        hasFerry = true;
        print("You count out three hundred dollars. Ogee hands you the rope and the pole. The ferry is yours.");
        print(`You now have $${money}.`);
      } else if (hasFerry) print("You already own the ferry.");
      else print("You don't have enough money. The ferry is three hundred dollars. Keep hauling kegs or cutting timber.");
    } else print("Ogee isn't here.");
  } else if (input.includes("price")) {
    if (currentScene === "ferry") print('Ogee says, "Three hundred dollars. Boat\'s sound. Rope\'s new last spring. Work it off if you want — whiskey kegs to the settlement, twenty dollars a trip."');
    else print("Nothing to buy here.");
  } else {
    print("You don't know how to do that. Try look around, examine [object], talk to [person], ask about [topic], go [direction], haul, timber, buy land, or buy ferry.");
  }
}

print("Dixon Parser — Present-day museum. Type 'look around' to begin. Leave toward the river to enter the fog.");
print("Earn money in 1830 by hauling kegs ($20) or cutting timber with an axe ($15). Changes appear in the museum on return.");
cmd.maxLength = 40;
cmd.addEventListener("keydown", e => { if (e.key === "Enter") handle(); });
</script>
</body>
</html>
