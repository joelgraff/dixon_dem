<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181a">
<title>Dixon Parser</title>
<style>
body { font-family: Georgia, "Times New Roman", serif; background: #16181a; color: #d8d4c8; margin: 0; }
main { max-width: 64rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
#layout { display: flex; gap: 1rem; align-items: flex-start; }
#play { flex: 1; min-width: 0; }
#notes { width: 16rem; height: 62vh; overflow-y: auto; border-top: 1px solid #333; border-bottom: 1px solid #333; padding: 0.5rem 0.8rem; font-size: 0.95rem; line-height: 1.4; }
#notes h2 { font-size: 0.8rem; font-weight: normal; letter-spacing: 0.12em; text-transform: uppercase; color: #8a867a; margin: 0.8rem 0 0.3rem; }
#notes h2.current { color: #d8d4c8; }
#notes details { margin: 0.15rem 0; }
#notes summary { cursor: pointer; color: #7ec8e3; text-transform: capitalize; }
#notes details p { margin: 0.3rem 0 0.6rem; color: #b8b4a8; }
#notes .empty { color: #6c685e; font-style: italic; }
#quick { display: none; gap: 0.4rem; margin-top: 0.6rem; overflow-x: auto; -webkit-overflow-scrolling: touch; }
#quick button { flex: none; padding: 0.55rem 0.8rem; min-height: 2.5rem; }
@media (pointer: coarse) { #quick { display: flex; } }
@media (max-width: 760px) {
  html, body { height: 100%; overscroll-behavior: none; }
  body { -webkit-text-size-adjust: 100%; }
  main { height: 100dvh; box-sizing: border-box; display: flex; flex-direction: column; padding: 0.5rem 0.7rem calc(0.6rem + env(safe-area-inset-bottom)); padding-left: max(0.7rem, env(safe-area-inset-left)); padding-right: max(0.7rem, env(safe-area-inset-right)); }
  h1 { margin: 0.3rem 0; }
  #layout { flex: 1; min-height: 0; flex-direction: column; gap: 0.5rem; }
  #play { flex: 1; min-height: 0; display: flex; flex-direction: column; width: 100%; }
  #output { flex: 1; height: auto; min-height: 0; padding: 0.4rem 0.2rem; font-size: 1rem; }
  #notes { width: auto; height: auto; max-height: 20dvh; flex: none; }
  #bar { margin-top: 0.5rem; }
  #cmd { font-size: 16px; padding: 0.7rem; }
  button { min-height: 2.75rem; }
  #settings { max-height: 40dvh; overflow-y: auto; }
}
#head { display: flex; justify-content: space-between; align-items: center; }
#gear { padding: 0.3rem 0.7rem; font-size: 0.9rem; }
#settings { display: none; background: #202325; border: 1px solid #444; padding: 0.8rem 1rem; margin-bottom: 1rem; font-size: 0.95rem; }
#settings.open { display: block; }
#settings label { display: block; margin: 0.4rem 0; cursor: pointer; }
#settings small { display: block; color: #8a867a; margin-left: 1.5rem; }
body.clicks .interactive { cursor: pointer; text-decoration: underline dotted; }
body.nosidebar #notes { display: none; }
h1 { font-weight: normal; letter-spacing: 0.15em; font-size: 1.1rem; color: #8a867a; text-transform: uppercase; }
#output { height: 62vh; overflow-y: auto; padding: 0.5rem 1rem; border-top: 1px solid #333; border-bottom: 1px solid #333; line-height: 1.55; font-size: 1.05rem; }
#output p { margin: 0 0 0.9rem; }
#output p.echo { color: #8a867a; font-family: monospace; margin-bottom: 0.4rem; }
#output p.heading { color: #8a867a; font-variant: small-caps; letter-spacing: 0.1em; margin-top: 1.6rem; }
.interactive { color: #7ec8e3; }
#bar { display: flex; gap: 0.5rem; margin-top: 1rem; }
#cmd { flex: 1; background: #202325; color: #e8e4d8; border: 1px solid #444; padding: 0.6rem; font-family: monospace; font-size: 1rem; }
button { background: #2a2e30; color: #d8d4c8; border: 1px solid #444; padding: 0.6rem 1rem; font-family: monospace; cursor: pointer; }
</style>
</head>
<body>
<main>
<div id="head"><h1>Dixon</h1><button id="gear" aria-expanded="false">Settings</button></div>
<div id="settings">
  <label><input type="checkbox" id="opt-sidebar"> Looked-at sidebar<small>Keeps a list of what you've examined, by scene.</small></label>
  <label><input type="checkbox" id="opt-clicks"> Clickable highlighted words<small>Click a highlighted word to examine it. Off by default; typing is the point.</small></label>
</div>
<div id="layout">
  <div id="play">
    <div id="output" aria-live="polite"></div>
    <div id="bar">
      <input id="cmd" maxlength="40" autocomplete="off" autocapitalize="off" autocorrect="off" enterkeyhint="go" spellcheck="false" placeholder="what do you do?" autofocus>
      <button id="enter">Enter</button>
    </div>
    <div id="quick" aria-label="Quick commands">
      <button data-run="look">look</button>
      <button data-run="north">N</button>
      <button data-run="south">S</button>
      <button data-run="east">E</button>
      <button data-run="west">W</button>
      <button data-run="up">up</button>
      <button data-run="down">down</button>
      <button data-fill="examine ">examine</button>
      <button data-fill="talk to ">talk</button>
      <button data-fill="ask about ">ask</button>
      <button data-run="inventory">inv</button>
    </div>
  </div>
  <aside id="notes" aria-label="Things you have looked at"></aside>
</div>
</main>
<script>
const output = document.getElementById('output');
const cmd = document.getElementById('cmd');

const settings = { sidebar: true, clicks: false };
try { Object.assign(settings, JSON.parse(localStorage.getItem("dixonSettings") || "{}")); } catch (e) {}

function applySettings() {
  if (typeof document.body === "undefined" || !document.body) return;
  document.body.classList.toggle("nosidebar", !settings.sidebar);
  document.body.classList.toggle("clicks", settings.clicks);
  const sb = document.getElementById("opt-sidebar"), ck = document.getElementById("opt-clicks");
  if (sb) sb.checked = settings.sidebar;
  if (ck) ck.checked = settings.clicks;
  try { localStorage.setItem("dixonSettings", JSON.stringify(settings)); } catch (e) {}
}

const state = {
  scene: "museum",
  money: 0,
  hasLand: false,
  hasFerry: false,
  hasAxe: false,
  visited1830: false,
  returned: false,
  turnsHere: 0,
  volunteerSpoke: false,
  signed: false,
  found: {},
  parted: {},
  notes: {},
  visitedScenes: []
};

const esc = t => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const fmt = t => esc(t).replace(/\[([^\]]+)\]/g, '<span class="interactive" data-noun="$1">$1</span>').replace(/\n/g, "<br>");

function print(text, cls) {
  output.innerHTML += `<p${cls ? ` class="${cls}"` : ""}>${fmt(text)}</p>`;
  output.scrollTop = output.scrollHeight;
}

function phoneText() {
  const fog = state.scene === "riverbank" ? state.turnsHere : 0;
  if (state.scene === "ferry" || state.scene === "farbank" || state.scene === "cabins") {
    return "The screen is black. When you hold the button it lights for a moment — no bars, no clock, only a thin line where the battery should be — then it goes dark again.";
  }
  if (fog >= 4) return "The screen is dim and the bars are gone. The clock reads 4:17 and does not change while you watch it.";
  if (fog >= 2) return "The signal is down to one bar and flickering. The mist has beaded on the glass.";
  return "Battery at 61 percent, full signal. Nothing new.";
}

function guestEntries() {
  const entries = [
    "“Lovely little museum! — D. & S., Rockford.”",
    "“Came for the Reagan boyhood home, stayed for the ferry. — Peoria.”",
    "“My great-grandfather is in the 1912 photo, third from left. — K. Novak.”",
    "“Cold in here. Good coffee, though.”",
    "“Ohio sends its regards.”",
    "“The little boy in the flood picture is my grandpa!”",
    "“Where is the thing that goes on the pedestal?”",
    "A child's drawing of a boat, signed with a crayon.",
    "“Fog again today.” No name, just the date in pencil."
  ];
  if (state.visited1830) {
    entries.push(
      "In a hurried hand: “The river is not where it was.” It has been crossed out.",
      "“Does anyone else hear knocking down by the water?”",
      "“Ask Margaret about the labels.” Nobody has signed it."
    );
  }
  return entries;
}

const scenes = {
  museum: {
    name: "Dixon Historic Center",
    look: () => {
      let text = "The front room is quiet and a little too brightly lit. Fluorescent tubes hum over a row of glass [cases] and a wall of framed [photos]. The founding [exhibit] takes up most of the far wall, and beside it a [pedestal] stands with a faded ring pressed into its velvet where something used to sit.\n\n";
      text += state.returned
        ? "A [volunteer] in a cardigan sits behind the [desk] by the entrance, frowning across the room at the exhibit panel. "
        : "A [volunteer] in a cardigan sits behind the [desk] by the entrance, a pencil moving slowly over a crossword. ";
      text += "Late light comes through the [window] the color of weak tea, and the glass door to the street has been propped open.";
      return text;
    },
    listen: "The lights hum. Somewhere in the back a clock ticks a little behind the others.",
    extras: {
      guestbook: "A [guestbook] lies open on the desk.",
      drawer: "The desk has a [drawer] with a small brass lock.",
      card: "A small typed [card] is propped against the pedestal."
    },
    objects: {
      exhibit: {
        aliases: ["panel", "founding", "display", "wall"],
        desc: () => {
          if (!state.visited1830) return "A wall panel and a small case, titled THE FOUNDING OF DIXON. “John Dixon established a ferry and trading post on the Rock River in the early 1830s. The settlement that grew around it took his name.” The paragraph ends a line short, as though a sentence was left out.";
          if (state.hasLand && state.hasFerry) return "The panel has changed. A land-patent card is pinned beside it, and a new line notes that the ferry passed to a newcomer in 1830. The case now holds a small object where there was only felt before.";
          if (state.hasLand) return "The panel is the same, but a new land-patent card has been pinned beside it. It describes a sixty-acre ridge timber plot, claimant unknown.";
          if (state.hasFerry) return "The panel is the same, but a new line has been added: the ferry changed hands in 1830, to a newcomer whose name was not recorded.";
          return "The panel reads exactly as it did. If anything changed, it isn't here.";
        }
      },
      cases: {
        aliases: ["case", "glass", "glass cases", "display case"],
        desc: "Arrowheads on cotton, a cracked clay pipe, a ledger page too faded to read. The cards under each are typed, not printed. The last case in the row is an [empty case], the felt brushed and the glass wiped.",
        reveals: ["emptycase"],
        verbs: { open: "The cases are locked. The little brass keyholes are clean, as if someone opens them often." }
      },
      emptycase: {
        hidden: true,
        title: "empty case",
        aliases: ["empty case", "bare case", "last case", "empty"],
        desc: "A case like the others, with a card holder and nothing in it. The card holder is empty too. Somebody dusts it regularly, all the same."
      },
      card: {
        hidden: true,
        aliases: ["label", "note"],
        desc: "The typed card, slightly crooked, reads: “Exhibit temporarily removed for conservation.” Below it, in pencil, someone has written and half erased: ask Margaret."
      },
      photos: {
        aliases: ["photo", "photographs", "pictures", "frames", "wall of photos"],
        desc: () => {
          let text = "Mostly the twentieth century: a parade on Galena Avenue, the theatre marquee lit at night, a flooded riverbank with men in rowboats. The last two frames in the row are empty, just bare mats.";
          if (state.returned && state.hasFerry) text = text.replace("The last two frames in the row are empty, just bare mats.", "One of the last two frames, empty before, now holds a faded print of a flatboat and a figure at its pole. The label says: Ferry operator, 1830s, name unknown.");
          else if (state.returned && state.hasLand) text = text.replace("The last two frames in the row are empty, just bare mats.", "One of the last two frames, empty before, now holds a survey plat of a ridge lot, labeled Unknown claimant.");
          return text;
        }
      },
      pedestal: {
        aliases: ["empty", "stand", "plinth"],
        desc: () => {
          if (state.returned && state.hasLand && state.hasFerry) return "On the velvet where there was only a faded ring, a corroded iron pole-shoe from a river flatboat. The card says: “Donor unknown.”";
          return "A waist-high pedestal with a ring pressed into its velvet, as if something heavy and round sat here for decades. A small typed [card] is propped against its base.";
        },
        reveals: ["card"],
        verbs: {
          touch: "The velvet is cool and compressed into a perfect ring. Whatever sat here sat here a very long time.",
          push: "It doesn't budge. It's bolted to the floor."
        }
      },
      desk: {
        aliases: ["volunteer desk", "table", "chair"],
        desc: () => "A tidy desk, older than everything around it: a lanyard, a roll of mints, a cold cup of coffee with a lipstick ring on the lid" + (state.returned ? ", and a hand-lettered sign reading ASK ABOUT THE LATEST LABELS" : "") + ". A [guestbook] lies open at the corner nearest the door, and below the blotter the middle [drawer] has a small brass lock.",
        reveals: ["guestbook", "drawer"],
        verbs: { sit: "You glance at the chair. Margaret looks at you over her glasses and you think better of it." }
      },
      drawer: {
        hidden: true,
        aliases: ["middle drawer", "lock", "keyhole"],
        desc: "A shallow middle drawer with a small brass lock, much older than the rest of the desk's hardware. The keyhole is worn bright.",
        verbs: {
          open: "Locked. The other drawers slide out easily, full of staples and brochures, but not this one.",
          push: "It doesn't budge.",
          search: "The other drawers hold staples, brochures, and a stapler. This one is locked."
        }
      },
      guestbook: {
        hidden: true,
        aliases: ["book", "register", "guest book", "log"],
        desc: () => {
          const pool = guestEntries();
          const picks = pool.sort(() => Math.random() - 0.5).slice(0, 3);
          let text = "You page back through the recent entries. " + picks.join(" ");
          if (state.signed) text += " Your own name is there, in your own hand, under the date.";
          return text + " A pen on a bead chain hangs beside it, for anyone who wants to leave their name.";
        },
        verbs: {
          sign: () => {
            if (state.signed) return "You've already signed. Your name sits there, a little smaller than you remembered writing it.";
            state.signed = true;
            return "You take the pen on its chain and sign your name under the last line. The ink is darker than you expected.";
          },
          read: () => scenes.museum.objects.guestbook.desc(),
          close: "You flip the cover shut, then open it again; it feels rude to hide it."
        }
      },
      window: {
        aliases: ["view", "pane"],
        desc: "A parking lot, the back of a neighbor's garage, and a power line with two crows on it. The light is going brown, and a thin haze sits low over the roofs.",
        verbs: {
          open: "It's painted shut. The sash hasn't moved in decades.",
          touch: "The glass is cool and faintly damp on the outside.",
          sit: "There's no sill deep enough to sit on."
        }
      }
    },
    npcs: {
      volunteer: {
        name: "the volunteer",
        aliases: ["docent", "woman", "lady", "margaret"],
        desc: () => state.returned
          ? "Margaret, by her name tag: sixty or so, reading glasses pushed up into grey hair. She is looking at the exhibit panel with her head tilted, the way you look at a picture hung slightly crooked."
          : "A woman in a cardigan, sixty or so, reading glasses pushed up into grey hair. Her name tag says MARGARET. She sits at the [desk] working the crossword with the patience of long habit.",
        talk: () => {
          if (state.returned) {
            return state.volunteerSpoke === "back"
              ? "“Mm?” Margaret glances up. “Sorry. Still thinking about the labels.”"
              : (state.volunteerSpoke = "back", "“Oh, hello again. You were in earlier, weren't you?” She frowns at the wall. “Funny. I could swear the labels weren't like that this morning. Nobody's touched them.” She laughs, not quite convincingly.");
          }
          if (state.volunteerSpoke) return "Margaret glances up from the crossword and smiles. “Mm?”";
          state.volunteerSpoke = true;
          reveal(["guestbook"]);
          return "“Oh, hello! I'm Margaret. I'm here Saturdays, mostly.” She sets down her pencil. “Feel free to look around. And if you like, sign the [guestbook] before you go. We like to know who's been in.”";
        },
        fallback: "“Hm. I couldn't tell you. I'm afraid I couldn't say. You could try the front office on a weekday.”",
        topics: [
          { keys: ["river", "walk", "fog", "mist", "outside", "bank", "evening", "stroll", "path"], say: "“The riverwalk? It's the best of Dixon at this hour. Go up Hennepin, four blocks north. There's a marker there, Ogee's Ferry. Most people walk right past it.” She glances toward the window, though it only faces the parking lot. “The fog's been coming off the water all week. Odd, for the time of year.”" },
          { keys: ["ogee", "joseph"], say: "“Joseph Ogee. He ran a ferry here before anyone had heard of Dixon, by most accounts. Our panel gives him no line at all. The marker by the river does a little better.”" },
          { keys: ["dixon", "john", "founder", "founding", "exhibit", "panel", "ferry"], say: () => state.returned ? "“I'd have said that panel ended differently. Isn't that silly? Thirty-one years.”" : "“John Dixon, 1830. He took over the ferry, the panel says established, which is a tidy way to put it. If you want the untidy version, there's a marker on the river walk.”" },
          { keys: ["pedestal", "removed", "conservation", "card"], say: () => state.returned && state.hasLand && state.hasFerry ? "“That wasn't there this morning. It's an iron pole-shoe, off a flatboat. I couldn't tell you where it came from.” She doesn't sound as though she expects to be asked again." : "“Empty since before my time. Conservation, the card says. I've never once seen anyone conserve anything.” She smiles. “I've never known what stood there, either.”" },
          { keys: ["photo", "frames", "mats", "frame", "picture"], say: () => state.returned && (state.hasLand || state.hasFerry) ? "“One of the empty frames has something in it now. Nobody told me.”" : "“Those last two came back from the framer's in 'ninety-eight with nothing in them. Nobody ever filled them in.”" },
          { keys: ["desk", "drawer", "lock", "key"], reveals: ["drawer"], say: "“That desk came out of the old county clerk's office when they cleared it in the seventies. It's the nicest thing in the building, and the drawers still work, too. Except the locked one. Always wondered what's in it.”" },
          { keys: ["case", "cases", "arrowhead", "locked"], say: "“Locked, since 1998. The key's with the board. The empty one at the end I dust every Saturday, out of habit.”" },
          { keys: ["guestbook", "book", "sign", "visitor"], say: "“Everyone signs, even the ones who say they won't. Some of them write the oddest things.”" },
          { keys: ["lincoln", "black hawk", "fort", "war", "militia", "1832"], say: "“Dixon's Ferry was the staging ground in 1832. Lincoln came through as a militia captain, and so did half the officers of the next war. They never fought a battle here. Just passed through.”" },
          { keys: ["label", "labels", "change", "changed", "different"], say: () => state.returned ? "She hesitates. “I'd rather not say it out loud. The labels have changed, and nobody's touched them. That's all.”" : "“Labels? I wouldn't think so. They've been the same since the nineties.”" },
          { keys: ["margaret", "you", "yourself", "volunteer", "museum", "society"], say: "“Thirty-one years on Saturdays. Someone has to know where the stapler is.”" }
        ]
      }
    },
    exits: [
      { names: ["outside", "out", "door", "street", "leave"], to: "street", text: "You step through the propped door and out onto the sidewalk. The hum of the fluorescents fades behind you." }
    ]
  },

  street: {
    name: "West Fifth Street at Hennepin",
    look: () => "The sidewalk is warm and nearly empty. A [pickup] is parked at the [corner], and a house porch light clicks on across the way. The [museum] door stands behind you. This is a quiet residential block of old frame houses and big maples. Hennepin runs north; at the end of the next block you can make out the police station and the [courthouse], and beyond them the downtown blocks run on toward the [river], where the riverfront [path] begins.",
    listen: "A truck downshifts somewhere. Under it, very faintly, the sound of moving water.",
    objects: {
      museum: {
        aliases: ["center", "historic center", "dixon historic center", "building", "door"],
        desc: "The Dixon Historic Center, a modest brick building on the corner, with its glass door propped open. Inside, the fluorescents are still lit.",
        verbs: { open: "The door is already open.", touch: "The brick is still warm from the day." }
      },
      courthouse: {
        aliases: ["police station", "police", "station"],
        desc: "At the end of the next block, the courthouse and the police station sit side by side, stone and brick. Past them the buildings get taller and closer together: downtown.",
        verbs: { touch: "It's a block away." }
      },
      pickup: {
        aliases: ["truck"],
        desc: "A dusty pickup with an Illinois plate. A faded [sticker] curls on the bumper. Nobody is in it.",
        reveals: ["sticker"],
        verbs: { open: "Locked.", touch: "The hood is warm. Whoever left it here hasn't been gone long." }
      },
      sticker: {
        hidden: true,
        aliases: ["bumper sticker", "bumper"],
        desc: "RIVER DAYS COMMITTEE, with a cartoon ferry. The corner has peeled, and underneath there's a second, older sticker you can't read."
      },
      corner: {
        aliases: ["intersection"],
        desc: "A crosswalk, a bus bench with no bus. Nothing worth a second look.",
        verbs: { sit: "The bench is warm from the sun, and no bus is coming. You sit anyway for a moment, then get up." }
      },
      river: {
        aliases: ["strip", "water", "silver"],
        desc: "You can't see it from here. The Rock River is four blocks north, past the courthouse and through downtown, and the riverside walk runs along it.",
        verbs: { touch: "It's four blocks away." }
      }
    },
    extras: {
      sticker: "A faded [sticker] curls on the pickup's bumper."
    },
    npcs: {},
    exits: [
      { names: ["museum", "door", "back", "inside", "in", "south"], to: "museum", text: "You step back into the cool, bright room. Margaret glances up from her desk and gives you a small smile." },
      { names: ["path", "river", "north", "uphill", "riverfront", "walk"], to: "riverpath", text: "You walk north up Hennepin, past the police station and the courthouse, then through three blocks of downtown storefronts, until the pavement gives out into the riverside walk." }
    ]
  },

  riverpath: {
    name: "Riverside walk",
    look: () => "The riverfront is a broad public space of pale paving and limestone walls, running along the south bank between Peoria Avenue and Galena Avenue, the kind of place that fills up for the farmers market and the Petunia Festival concerts, though tonight it is nearly empty. A green iron [railing] follows the curve of the wall above the water, and a stone [pavilion] stands a little way along, with a [bench] facing the river. A bronze [statue] of a man on a horse rises from the plaza nearby, and between them a green historical [marker] stands on a post. The [river] is wide and brown and slow, and a long raft of mist lies on it. At the far end of the railing, a wide [stairway] of worn steps leads down to the bank. Behind you, Hennepin [street] runs south through downtown, back toward the Historic Center.",
    listen: "Water against stone. A halyard clinking, though there are no boats.",
    objects: {
      marker: {
        aliases: ["sign", "historical marker", "post"],
        desc: "OGEE'S FERRY. “A ferry crossed the Rock River at about this spot by the late 1820s, kept by Joseph Ogee. The settlement that grew on this bank took its name from John Dixon, who arrived in 1830.” Near the bottom, a line of smaller type has been [sanded] away, leaving a pale smooth patch.",
        reveals: ["sanded"],
        verbs: { touch: "The paint is gritty with old salt. You can feel where the sanding stopped." }
      },
      sanded: {
        hidden: true,
        aliases: ["sanded line", "patch", "pale patch", "line"],
        desc: "A few letters survive at the edge of the patch: …ever re… Whatever it said, someone cared enough to take it off, and not enough to repaint.",
        verbs: { touch: "Smooth as a pebble, and cooler than the paint around it." }
      },
      bench: {
        aliases: ["seat"],
        desc: "A slatted bench with a [plate] screwed to the back. The slats are damp, though it hasn't rained.",
        reveals: ["plate"],
        verbs: { sit: "You sit for a while. The mist on the water doesn't move, and neither, you notice, does anything else. The city sounds seem a little farther away than when you sat down." }
      },
      plate: {
        hidden: true,
        aliases: ["brass plate", "inscription"],
        desc: "FOR HARRY, WHO KNEW THE RIVER. 1931–2009. Below it someone has scratched, with a key or a nail: it remembers."
      },
      bronzeplaque: {
        hidden: true,
        aliases: ["plaque", "statue plaque", "dedication", "begins the trail", "paving"],

function scene() { return scenes[state.scene]; }

function visible(entry) { return (!entry.visible || entry.visible()); }

function isFound(key) { return state.found[state.scene + ":" + key]; }

function reveal(keys) {
  (keys || []).forEach(k => { state.found[state.scene + ":" + k] = true; });
}

function describe(entry) { return typeof entry.desc === "function" ? entry.desc() : entry.desc; }

function editDistance(a, b) {
  const row = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let diagonal = row[0];
    row[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const above = row[j];
      row[j] = Math.min(row[j] + 1, row[j - 1] + 1, diagonal + (a[i - 1] === b[j - 1] ? 0 : 1));
      diagonal = above;
    }
  }
  return row[b.length];
}

  }
  for (const [key, npc] of Object.entries(s.npcs || {})) {
    if (visible(npc)) list.push({ type: "npc", key, entry: npc, labels: [key, npc.name.toLowerCase(), ...(npc.aliases || [])] });
  }
  list.push({ type: "item", key: "phone", entry: { desc: phoneText }, labels: ["phone", "cell", "cellphone", "mobile"] });
  if (state.hasAxe) list.push({ type: "item", key: "axe", entry: { desc: "A worn axe, heavier than it looks." }, labels: ["axe", "hatchet"] });
  return list;
}

function cleanName(name) {
  name = name.toLowerCase().trim();
  let prev;
  do {
    prev = name;
    name = name.replace(/^(the|a|an|at|to|in|on|out of|out|through|thru|inside|behind|under|around|over|into|up)\s+/, "");
  } while (name !== prev);
  return name;
}

function findTarget(name) {
  name = cleanName(name);
  const matches = candidates();
  const exact = matches.filter(m => m.labels.includes(name));
  if (exact.length === 1) return exact[0];
  if (exact.length > 1) return { type: "ambiguous", candidates: exact.slice(0, 2) };
  const scored = matches.map(m => ({ ...m, distance: Math.min(...m.labels.map(label => editDistance(name, label))) })).sort((a, b) => a.distance - b.distance);
  if (name.length >= 4 && scored.length && scored[0].distance <= 1) {
    const best = scored.filter(m => m.distance === scored[0].distance);
    return best.length === 1 ? best[0] : { type: "ambiguous", candidates: best.slice(0, 2) };
  }
  if (name.length >= 4 && scored.length && scored[0].distance <= 2) return { type: "suggestions", candidates: scored.slice(0, 2) };
  return null;
}

function clarify(found) {
  const names = found.candidates.map(c => c.key).join(" or ");
  print(found.type === "ambiguous" ? `Which do you mean: ${names}?` : `I don't see that exactly. Did you mean ${names}?`);
}

const DIRS = { n: "north", s: "south", e: "east", w: "west", u: "up", d: "down" };

function findExit(name) {
  name = name.toLowerCase().trim().replace(/^(the|to|toward|towards|into|through)\s+/, "");
  name = DIRS[name] || name;
  return scene().exits.find(e => e.names.includes(name));
}

function look() {
  const s = scene();
  let text = s.look();
  const extras = Object.entries(s.extras || {}).filter(([k]) => isFound(k)).map(([, t]) => t);
  if (extras.length) text += " " + extras.join(" ");
  print(text);
}

function arrive(id, text, onArrive) {
  state.scene = id;
  state.turnsHere = 0;
  state.parted = {};
  if (!state.visitedScenes.includes(id)) state.visitedScenes.push(id);
  if (onArrive) onArrive();
  if (text) print(text);
  print(scene().name, "heading");
  look();
  renderNotes();
}

function move(exit) {
  if (exit.when && !exit.when()) { print(exit.blocked || "You can't go that way."); return true; }
  if (!exit.to) { print(exit.blocked || "You can't go that way."); return true; }
  farewell(exit);
  arrive(exit.to, exit.text, exit.onArrive);
  return true;
}

const PARTING = {
  volunteer: () => state.returned
    ? "You nod to Margaret on your way out. “Take care out there,” she says, still watching the panel."
    : "You thank Margaret and say you'll be back. “Do come again,” she says, pencil already moving. “And mind the fog, it comes up quick.”",
  ogee: "You nod to Ogee. He lifts his chin without looking up from the plank.",
  dixon: "You nod to Dixon, and he touches two fingers to his hat brim.",
  clerk: "You nod to the clerk, who does not look up from the ledger.",
  settler: "You nod to Eli, and he nods back, watching the river."
};

function farewell(exit) {
  if (exit.noFarewell) return;
  const here = npcsHere().filter(n => PARTING[n.key]);
  const unsaid = here.filter(n => !state.parted[n.key]);
  if (!unsaid.length) return;
  if (here.length === 1) {
    const p = PARTING[here[0].key];
    print(typeof p === "function" ? p() : p);
  } else {
    print("You nod to the others and take your leave.");
  }
}

function examine(name) {
  const found = findTarget(name);
  if (!found) return print("You don't see that here.");
  if (found.type === "ambiguous" || found.type === "suggestions") return clarify(found);
  const text = describe(found.entry);
  print(text);
  reveal(found.entry.reveals);
  recordNote(found, text);
}

function recordNote(found, text) {
  if (found.type === "item") return;
  const id = state.scene;
  state.notes[id] = state.notes[id] || {};
  const title = found.entry.title || (found.type === "npc" ? found.entry.name.replace(/^(the|a)\s+/, "") : found.key);
  state.notes[id][found.key] = { title, text };
  renderNotes();
}

function renderNotes() {
  const panel = document.getElementById("notes");
  if (!panel) return;
  const open = new Set([...panel.querySelectorAll("details[open]")].map(d => d.dataset.id));
  const order = [state.scene, ...state.visitedScenes.filter(id => id !== state.scene).reverse()];
  let html = "";
  for (const id of order) {
    const entries = Object.entries(state.notes[id] || {});
    const current = id === state.scene;
    if (!entries.length && !current) continue;
    html += `<h2${current ? ' class="current"' : ""}>${esc(scenes[id].name)}</h2>`;
    if (!entries.length) html += '<div class="empty">Nothing yet.</div>';
    for (const [key, note] of entries) {
      const did = id + ":" + key;
      html += `<details data-id="${did}"${open.has(did) ? " open" : ""}><summary>${esc(note.title)}</summary><p>${fmt(note.text)}</p></details>`;
    }
  }
  panel.innerHTML = html;
}

const VERB_CANON = {
  sign: "sign", write: "sign", "write in": "sign", "write on": "sign", autograph: "sign",
  read: "read", sit: "sit", "sit on": "sit", "sit at": "sit", "sit in": "sit", "sit down": "sit",
  touch: "touch", feel: "touch", pat: "touch", rub: "touch", stroke: "touch",
  push: "push", pull: "push", shove: "push", turn: "push", move: "push", knock: "push", "knock on": "push", kick: "push",
  smell: "smell", sniff: "smell", taste: "taste", lick: "taste",
  open: "open", close: "close", shut: "close",
  climb: "climb", "climb on": "climb",
  search: "search", rummage: "search", "look through": "search", "dig through": "search",
  drink: "drink", sip: "drink", ring: "push", lean: "touch", "lean on": "touch",
  use: "use", take: "take", get: "take", grab: "take",
  board: "board", ride: "board", shout: "call", call: "call", yell: "call", answer: "call", "call out": "call", "shout back": "call"
};

const VERB_DEFAULT = {
  board: "There's nothing here to board.",
  call: "Your voice goes flat in the damp air. Nothing answers.",
  sign: "There's nothing here to sign.",
  read: "There's nothing to read on it.",
  sit: "You'd rather not sit on that.",
  touch: "You touch it. Nothing in particular happens.",
  push: "It doesn't budge, and you feel a bit silly.",
  smell: "It smells like what it is.",
  taste: "You think better of it.",
  open: "It doesn't open, or there's nothing in it that you'd find.",
  close: "It isn't open.",
  climb: "You can't climb that.",
  search: "You look it over carefully but find nothing more.",
  drink: "That isn't something you can drink.",
  use: "You're not sure how to use that here.",
  take: "That isn't yours to take."
};

function act(verb, name) {
  const found = findTarget(name);
  if (!found) return print("You don't see that here.");
  if (found.type === "ambiguous" || found.type === "suggestions") return clarify(found);
  const e = found.entry;
  if (verb === "use" && found.key === "phone") return print(phoneText());
  const custom = e.verbs && e.verbs[verb];
  if (custom) {
    const result = typeof custom === "function" ? custom() : custom;
    if (result) print(result);
    return;
  }
  if (verb === "take" && e.take) return print(e.take());
  if (verb === "take" && found.type === "item") return print("It's already with you.");
  if (verb === "read" || verb === "search") return examine(name);
  if (verb === "open" && e.open) return print(e.open());
  print(VERB_DEFAULT[verb]);
}

const SPEAKER = { volunteer: "Margaret", ogee: "Ogee", dixon: "Dixon", clerk: "The clerk", settler: "Eli" };

const SOCIAL = {
  volunteer: {
    hello: "“Hello, hello.” She smiles over her glasses.",
    thanks: "“Oh, you're very welcome. Nobody thanks the volunteers. Not often.”",
    bye: "“Mind the fog on your way. It comes up quick this time of year.”",
    how: "“Can't complain. Quiet Saturday, a crossword, and someone to talk to. That's a good day.”",
    sorry: "“Don't mention it.”"
  },
  ogee: {
    hello: "Ogee nods without stopping what he's doing. “Mm.”",
    thanks: "Ogee grunts. “Don't thank me yet. River's not done with any of us.”",
    bye: "“Watch the water.”",
    how: "“Alive. Dock's still standing. That's a good week.”",
    sorry: "“No harm done.”"
  },
  dixon: {
    hello: "Dixon inclines his head. “Good day to you.”",
    thanks: "“You're welcome. A man ought to be civil on a river.”",
    bye: "“Safe passage.”",
    how: "“Well enough. Trade is slow, but it's early yet.”",
    sorry: "“No offence taken.”"
  },
  clerk: {
    hello: "The clerk glances up from the ledger. “Yes?”",
    thanks: "“It's the office's duty.” He sounds as though it is not entirely a pleasure.",
    bye: "“Do come again when you have the money.”",
    how: "“Busy. The government doesn't survey itself.”",
    sorry: "“Quite.”"
  },
  settler: {
    hello: "Eli gives a quick, nervous nod. “Evening.”",
    thanks: "“Oh. Sure. Anytime.” He looks pleased and a little surprised.",
    bye: "“See you around. Watch the river.”",
    how: "“Jumpy, mostly. Folks say the war's coming back.”",
    sorry: "“It's all right.”"
  }
};

function speak(key, text) {
  const who = SPEAKER[key];
  if (who && text.startsWith("“")) text = `${who} says, ${text}`;
  print(text);
}

function talk(name) {
  const found = findTarget(name);
  if (!found || found.type === "suggestions" || found.type === "ambiguous") {
    if (found) return clarify(found);
    return print("There is no one by that name here.");
  }
  if (found.type !== "npc") return print("It doesn't answer.");
  const npc = found.entry;
  if (npc.talk) return speak(found.key, npc.talk());
  speak(found.key, npcTalk[found.key] || `${npc.name} looks at you but says nothing yet.`);
}

function social(kind, name) {
  let target = null;
  if (name) {
    const found = findTarget(name);
    if (found && (found.type === "ambiguous" || found.type === "suggestions")) return clarify(found);
    if (found && found.type === "npc") target = found;
  }
  if (!target) {
    const here = npcsHere();
    if (here.length === 1) target = here[0];
    else if (!here.length) return print("There's no one here to say that to.");
    else return print(`Say that to whom? ${here.map(n => n.key).join(" or ")}?`);
  }
  const lines = SOCIAL[target.key];
  if (kind === "hello" && target.key === "volunteer" && state.returned && !state.greeted) {
    state.greeted = true;
    return speak(target.key, "“Oh, hello again.” She glances at the panel and back. “Were you down by the river?”");
  }
  if (kind === "bye") state.parted[target.key] = true;
  speak(target.key, (lines && lines[kind]) || `${target.entry.name} acknowledges you with a nod.`);
}

function pleasantry(input) {
  let m;
  const person = "(?:\\s+(?:to\\s+)?(.+))?";
  if ((m = input.match(new RegExp("^(?:say\\s+)?(?:thanks|thank you|thank-you|thx|ty|cheers)(?:\\s+(?:so much|very much|a lot))?" + person + "$"))) ||
      (m = input.match(/^thank\s+(?:you\s+)?(.+)$/))) return social("thanks", m[1]);
  if ((m = input.match(new RegExp("^(?:say\\s+)?(?:hello|hi|hey|howdy|greetings|good (?:morning|afternoon|evening|day)|evening|afternoon)" + person + "$")))) return social("hello", m[1]);
  if ((m = input.match(new RegExp("^(?:say\\s+)?(?:goodbye|good-bye|bye|farewell|see you|see you later|take care|good night|cheerio)" + person + "$")))) return social("bye", m[1]);
  if ((m = input.match(/^(?:how are you|how's it going|how are things|how do you do|what's up|how have you been)(?:\s+(.+))?$/))) return social("how", m[1]);
  if ((m = input.match(new RegExp("^(?:say\\s+)?(?:sorry|excuse me|pardon me|apologi[sz]e)" + person + "$")))) return social("sorry", m[1]);
  if ((m = input.match(/^(?:have a (?:good|nice|great) (?:day|evening|night|one)|good luck|best wishes|well wishes)(?:\s+(.+))?$/))) return social("bye", m[1]);
  return false;
}

function npcsHere() {
  return candidates().filter(c => c.type === "npc");
}

function ask(rest) {
  const m = rest.match(/^(.+?)\s+(?:about|for|if)\s+(.+)$/);
  let npcName = m ? m[1] : null;
  let topic = m ? m[2] : rest.replace(/^(?:about|for)\s+/, "");
  let target = null;
  if (npcName) {
    const found = findTarget(npcName);
    if (found && (found.type === "ambiguous" || found.type === "suggestions")) return clarify(found);
    target = found;
  } else {
    const sole = npcsHere();
    if (sole.length === 1) target = sole[0];
    else if (!sole.length) return print("There's no one here to ask.");
    else {
      const guess = findTarget(rest);
      if (guess && guess.type === "npc") return talk(rest);
      return print(`Ask whom? ${sole.map(n => n.key).join(" or ")}?`);
    }
  }
  if (!target || target.type !== "npc") {
    const sole = npcsHere();
    if (sole.length === 1 && !npcName) target = sole[0];
    else return print("There's no one by that name here.");
  }
  const npc = target.entry;
  topic = cleanName(topic);
  const hit = (npc.topics || []).find(t => t.keys.some(k => topic.includes(k)));
  if (!hit) return speak(target.key, npc.fallback || `${npc.name} has nothing to say about that.`);
  speak(target.key, typeof hit.say === "function" ? hit.say() : hit.say);
  reveal(hit.reveals);
}

function run(input) {
  let m;
  if (/^(look|l)( around)?$/.test(input)) return look();
  if ((m = input.match(/^(?:pick up|take|get|grab)\s+(.+)$/))) return act("take", m[1]);
  if ((m = input.match(/^(?:look at|examine|x|inspect|check|study|look in|look under|look behind)\s+(.+)$/))) return examine(m[1]);
  if ((m = input.match(/^look\s+(.+)$/))) {
    const exit = findExit(m[1]);
    if (exit) return print(exit.peek || `You look ${m[1]}, but see nothing you hadn't already seen.`);
    return examine(m[1]);
  }
  if ((m = input.match(/^(?:talk to|talk with|speak to|speak with|tell|chat with)\s+(.+?)\s+about\s+(.+)$/))) return ask(`${m[1]} about ${m[2]}`);
  if ((m = input.match(/^(?:talk to|talk with|speak to|speak with|greet|chat with)\s+(.+)$/))) return talk(m[1]);
  if (/^(?:shout|call|yell|answer)(?: out| back)?$/.test(input)) {
    return state.scene === "riverbank" && state.turnsHere >= 6 ? act("call", "voice") : print(VERB_DEFAULT.call);
  }
  if ((m = input.match(/^ask\s+(.+)$/))) return ask(m[1]);
  if ((m = input.match(/^(?:go|walk|head|enter|move)(?: to| toward| towards| into| through)?\s+(?:the\s+)?(.+)$/))) {
    const exit = findExit(m[1]);
    return exit ? move(exit) : print("You can't go that way.");
  }
  const bare = findExit(input);
  if (bare) return move(bare);
  const verbs = Object.keys(VERB_CANON).sort((a, b) => b.length - a.length);
  for (const v of verbs) {
    if (input.startsWith(v + " ")) return act(VERB_CANON[v], input.slice(v.length + 1));
  }
  if (/^(wait|z|rest)$/.test(input)) return print("You wait. Time passes, slowly.");
  if (pleasantry(input) !== false) return;
  if (/^listen$/.test(input)) return print(scene().listen || "You listen. Nothing stands out.");
  if (/^(i|inv|inventory)$/.test(input)) {
    const carried = ["your phone"];
    if (state.hasAxe) carried.push("an axe");
    print(`You are carrying ${carried.join(" and ")}.` + (state.visited1830 ? ` There is $${state.money} in your pocket.` : ""));
    return;
  }
  if (/^(think|goals|recall)$/.test(input)) {
    if (!state.visited1830) return print("You think about the empty pedestal, and the line of the panel that ends too soon.");
    const bits = [`You have $${state.money}.`];
    if (state.hasLand) bits.push("The ridge plot is yours.");
    if (state.hasFerry) bits.push("The ferry is yours.");
    if (state.hasLand && state.hasFerry) bits.push("It feels, for a moment, like the first chapter is finished.");
    return print(bits.join(" "));
  }
  if (/^(haul|load kegs?|deliver)$/.test(input) || /^(haul|load keg|deliver)/.test(input)) {
    if (state.scene === "ferry" || state.scene === "farbank") {
      state.money += 20;
      print("You load the kegs and pole across. Dixon counts them and marks the ledger. Twenty dollars for the trip.");
      print(`You now have $${state.money}.`);
    } else print("There's nothing here to haul.");
    return;
  }
  if (/^(chop|cut wood|timber|cut timber)/.test(input)) {
    if (state.hasAxe && (state.scene === "cabins" || state.scene === "ferry")) {
      state.money += 15;
      print("You spend the day cutting white oak. The sawmill downriver will take it. Fifteen dollars for the load.");
      print(`You now have $${state.money}.`);
    } else if (!state.hasAxe) print("You haven't got anything to cut it with.");
    else print("There's no timber to cut here.");
    return;
  }
  if (/^(buy|purchase) (land|plot)/.test(input)) {
    if (state.scene !== "farbank") return print("The land office is across the river, at Dixon's trading post.");
    if (state.hasLand) return print("You already own the ridge plot.");
    if (state.money < 42) return print("You don't have enough money. The ridge plot is forty dollars plus a two-dollar fee.");
    state.money -= 42;
    state.hasLand = true;
    print("You count out forty-two dollars. The clerk stamps the paper. The ridge-line timber plot is yours. Get it surveyed before you build.");
    print(`You now have $${state.money}.`);
    return;
  }
  if (/^(buy|purchase) (ferry|boat)/.test(input)) {
    if (state.scene !== "ferry") return print("Ogee isn't here.");
    if (state.hasFerry) return print("You already own the ferry.");
    if (state.money < 300) return print("You don't have enough money. The ferry is three hundred dollars.");
    state.money -= 300;
    state.hasFerry = true;
    print("You count out three hundred dollars. Ogee hands you the rope and the pole. The ferry is yours.");
    print(`You now have $${state.money}.`);
    return;
  }
  if (/^price/.test(input)) {
    return print(state.scene === "ferry" ? 'Ogee says, “Three hundred dollars. Boat\'s sound. Rope\'s new last spring.”' : "Nothing here is for sale.");
  }
  print(`You can't think how to do that. (${VERBS})`);
}

function handle() {
  const raw = cmd.value.trim().slice(0, 40);
  cmd.value = "";
  if (!raw) return;
  print("> " + raw, "echo");
  const before = state.scene;
  run(raw.toLowerCase().replace(/[.!?]+$/, ""));
  if (state.scene === before) {
    state.turnsHere++;
    if (scene().onTick) scene().onTick();
  }
}

cmd.maxLength = 40;
cmd.addEventListener("keydown", e => { if (e.key === "Enter") handle(); });
const wire = (id, fn) => { const el = document.getElementById(id); if (el && el.addEventListener) el.addEventListener("change", fn); };
wire("opt-sidebar", e => { settings.sidebar = e.target.checked; applySettings(); });
wire("opt-clicks", e => { settings.clicks = e.target.checked; applySettings(); });
const gear = document.getElementById("gear");
if (gear && gear.addEventListener) gear.addEventListener("click", () => {
  const panel = document.getElementById("settings");
  const open = panel.classList.toggle("open");
  gear.setAttribute("aria-expanded", open);
});
output.addEventListener && output.addEventListener("click", e => {
  const noun = e.target.dataset && e.target.dataset.noun;
  if (settings.clicks && noun) { cmd.value = "examine " + noun; handle(); cmd.focus(); }
});
applySettings();
const quick = document.getElementById("quick");
if (quick && quick.addEventListener) quick.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest("button");
  if (!b) return;
  if (b.dataset.run) { cmd.value = b.dataset.run; handle(); }
  else { cmd.value = b.dataset.fill; cmd.focus(); }
});
const enterButton = document.getElementById("enter");
if (enterButton) enterButton.addEventListener("click", handle);

const start = typeof location !== "undefined" && /scene=(\w+)/.exec(location.search);
if (start && scenes[start[1]]) state.scene = start[1];
state.visitedScenes.push(state.scene);
print(scene().name, "heading");
look();
renderNotes();
</script>
</body>
</html>
